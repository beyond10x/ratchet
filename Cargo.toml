[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/ratchet-cli-contract"]

[workspace.package]
version = "0.0.5"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/ratchet"
publish = false

[workspace.dependencies]
ratchet-cli-contract = { path = "crates/ratchet-cli-contract" }
