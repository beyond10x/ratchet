version: '3'

includes:
  acceptance:
    taskfile: acceptance/Taskfile.yml
    optional: true

tasks:
  check:
    desc: Run the repository gate.
    cmds:
      - aep plan artifact validate
      - task: check:spec
      - task: check:rust
      - task: check:generated
      - task: check:scripts
      - task: test
      - task: check:ci-paths
      - task: site

  check:rust:
    desc: Check the format and the lints of the hand-written crates. A generated crate is no member of the workspace, so it is neither formatted nor linted.
    cmds:
      - cargo fmt --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  check:generated:
    desc: Compare each generated crate, byte for byte, with a fresh generation into target/check-generated. The crates and their generator lines are in .github/scripts/check-generated.sh.
    cmds:
      - sh .github/scripts/check-generated.sh

  generate:
    desc: Replace each generated crate with a fresh generation. Run it after a change of the specification; a generated file is never edited.
    cmds:
      - sh .github/scripts/check-generated.sh --write

  check:scripts:
    desc: Run every script test, .github/scripts/*.test.sh.
    cmds:
      - |
        set -eu
        n=0
        for t in .github/scripts/*.test.sh; do
          [ -f "$t" ] || { echo "check:scripts: no .github/scripts/*.test.sh"; exit 1; }
          echo "check:scripts: sh $t"
          sh "$t"
          n=$((n + 1))
        done
        echo "check:scripts: $n script test(s) passed"

  test:
    desc: Run the tests of the workspace with cargo-nextest. .config/nextest.toml ends a test at 60 s and the run at 120 s, each as a failure. The ten slowest tests are printed last.
    cmds:
      - cargo nextest run --workspace --locked --no-run
      - |
        set -eu
        log=target/test-step/nextest.txt
        mkdir -p target/test-step
        status=0
        cargo nextest run --workspace --locked > "$log" 2>&1 || status=$?
        cat "$log"
        slowest=$(awk '
          { gsub(/\033\[[0-9;]*m/, "") }
          match($0, /^ *[A-Z][A-Z0-9 ]*\[ *[0-9]+\.[0-9]+s\] +/) {
            name = substr($0, RSTART + RLENGTH)
            sub(/^\([^)]*\) +/, "", name)
            time = $0
            sub(/^[^[]*\[ */, "", time)
            sub(/s\].*$/, "", time)
            if (!(name in times) || time + 0 > times[name] + 0) times[name] = time
          }
          END { for (name in times) printf "%10ss  %s\n", times[name], name }
        ' "$log" | LC_ALL=C sort -k1,1nr -k2 | head -10)
        echo "test: the ten slowest tests"
        if [ -n "$slowest" ]; then
          printf '%s\n' "$slowest"
        elif [ "$status" = 0 ]; then
          echo "test: cargo nextest run exited 0 and its output names no test with its time"
          exit 1
        fi
        exit "$status"

  check:spec:
    desc: Validate the ESS specification and the ess-cli/2 binding of the ratchet commands, check the field rows and the examples of the record formats and the errors the design names against it, check that those checks refuse a hidden defect, and synthesize the Rust crate into target/check-spec without a refusal. Needs jq.
    cmds:
      - |
        command -v jq > /dev/null 2>&1 || { echo "check:spec: jq is not installed, and spec/record-examples.test.sh reads the JSON examples with it"; exit 1; }
      - ess specify validate --path spec --strict-requires
      - ess specify cli --path spec --binding spec/cli.yaml --strict-requires
      - sh spec/record-fields.test.sh
      - sh spec/record-types.test.sh
      - sh spec/record-examples.test.sh
      - sh spec/contract-examples.test.sh
      - sh spec/cli-coverage-row.test.sh
      - sh spec/cli-errors.test.sh
      - sh spec/gate-inputs.test.sh
      - |
        set -eu
        out=target/check-spec
        rm -rf "$out"
        mkdir -p "$out"
        if ! ess generate synthesize --path spec --target rust --layout crate --out "$out/crate" > "$out/synthesize.txt" 2>&1; then
          cat "$out/synthesize.txt"
          echo "check:spec: ess generate synthesize --target rust did not emit the specification"
          exit 1
        fi
        cat "$out/synthesize.txt"
        grep -q ', 0 refused$' "$out/synthesize.txt" || { echo "check:spec: the synthesis line does not report 0 refused"; exit 1; }

  site:
    desc: Build the documentation site (website/, pages read from vision.md, docs/ and research/) into website/build.
    dir: website
    cmds:
      - npm ci
      - npm run build

  check:ci-paths:
    silent: true
    desc: "Feed the change classifier of .github/workflows/pages.yml one file list per case: planning, docs-site, code, mixed, empty."
    cmds:
      - |
        set -eu
        step=$(awk '
          /- name: Classify the changed files$/ { f = 1; next }
          f && !r && /run: \|$/ { r = 1; i = match($0, /[^ ]/); next }
          r && /^ *$/ { print ""; next }
          r { j = match($0, /[^ ]/); if (j <= i) exit; print substr($0, i + 2) }
        ' .github/workflows/pages.yml)
        test -n "$step" || { echo "no classifier step in .github/workflows/pages.yml"; exit 1; }
        fail=0 n=0
        while IFS='|' read -r want files; do
          n=$((n + 1))
          got=$(printf '%s' "$files" | tr ' ' '\n' | CHANGED_FILES= GITHUB_OUTPUT=/dev/stdout bash -c "$step" | sed -n 's/^class=//p')
          if [ "$got" = "$want" ]; then echo "ok   $want <- ${files:-(none)}"; else echo "FAIL $want <- ${files:-(none)}: got ${got:-nothing}"; fail=1; fi
        done <<'CASES'
        planning|.engineering/planning/project.yaml
        planning|.engineering/planning/story/x.md
        planning|AGENTS.md CLAUDE.md README.md
        planning|.engineering/planning/story/x.md AGENTS.md
        docs-site|vision.md
        docs-site|docs/design.md
        docs-site|research/synthesis.md
        docs-site|research/responses/slot.md
        docs-site|website/docusaurus.config.ts
        docs-site|website/product.json
        docs-site|AGENTS.md docs/design.md
        code|Taskfile.yml
        code|.github/workflows/pages.yml
        code|LICENSE
        code|README.md crates/ratchet/src/lib.rs
        code|docs/design.md src/main.rs
        code|
        planning|spec/README.md
        code|spec/cli.yaml
        code|Cargo.lock
        code|rust-toolchain.toml
        code|.config/nextest.toml
        code|.github/scripts/check-generated.sh
        code|crates/ratchet/tests/validate.rs
        code|crates/ratchet-cli-contract/README.md
        code|.engineering/planning/story/x.md crates/ratchet-cli-contract/README.md
        CASES
        echo "$n cases"
        exit $fail
