format: ratchet/1
project: workflow-driver

subjects:
  source-tree:
    kind: codebase
    audiences: [developer, coding-agent]
  service-contract:
    kind: api-operation
    audiences: [api-consumer]

assessments:
  lint-findings:
    subject: source-tree
    assessor: clippy-report@1
    target: {kind: revision, environments: [local]}
    observation:
      kind: snapshot
      command: cargo clippy --locked --all-targets -- -D warnings
      conditions:
        all:
          tools: {rustc: {pin: rust-toolchain.toml}}
      coverage: {executed: 4, skipped: 0}
    measurements:
      findings:
        kind: exact
        output: findings
        scope: run
        identity: [rule, path]

  unreferenced-files:
    subject: source-tree
    assessor: project-command@1
    target: {kind: revision, environments: [local]}
    observation:
      kind: snapshot
      command: task check:unreferenced
      coverage: {skipped: 0}
    measurements:
      findings:
        kind: exact
        output: findings
        scope: run
        identity: [rule, path]

  secret-scan:
    subject: source-tree
    assessor: secret-scan-report@1
    inputs: {report: target/scan/secrets.json}
    target: {kind: revision, environments: [local]}
    observation:
      kind: snapshot
      coverage: {skipped: 0}
    measurements:
      findings:
        kind: exact
        output: findings
        scope: run
        identity: [rule, path]

  passing-conformance-cases:
    subject: service-contract
    assessor: ess-conformance-report@1
    inputs: {report: target/conformance/report.json}
    target: {kind: deployment, environments: [staging]}
    observation:
      kind: snapshot
      coverage: {skipped: 0}
    measurements:
      passing-cases:
        kind: exact
        output: passing_cases
        scope: run
        identity: [case_id]

requirements:
  no-lint-findings:
    assessment: lint-findings
    condition: {operator: lte, value: 0}
  no-new-unreferenced-files:
    assessment: unreferenced-files
    condition: {operator: no_new_items}
    reference: {kind: accepted_value}
  no-new-secret-findings:
    assessment: secret-scan
    condition: {operator: no_new_items}
    reference: {kind: accepted_value}
  no-lost-passing-cases:
    assessment: passing-conformance-cases
    condition: {operator: no_lost_items}
    reference: {kind: accepted_value}

gates:
  merge:
    stage: pre-merge
    qualifying_environments: [local]
    requires:
      - no-lint-findings
      - no-new-unreferenced-files
      - no-new-secret-findings
  promote:
    stage: pre-promotion
    qualifying_environments: [staging]
    requires: [no-lost-passing-cases]

exceptions:
  known-failing-a:
    requirement: no-lost-passing-cases
    item: {case_id: case-a}
    reason: Fails on the deployed build. The fix is tracked in the owner story.
    owner: story:case-a
    created: 2026-11-23
    expires: 2026-11-30
  known-failing-b:
    requirement: no-lost-passing-cases
    item: {case_id: case-b}
    reason: Fails on the deployed build. The fix is tracked in the owner story.
    owner: story:case-b
    created: 2026-11-23
    expires: 2026-11-30
  known-failing-c:
    requirement: no-lost-passing-cases
    item: {case_id: case-c}
    reason: Fails on the deployed build. The fix is tracked in the owner story.
    owner: story:case-c
    created: 2026-11-23
    expires: 2026-11-30
