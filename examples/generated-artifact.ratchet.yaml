format: ratchet/1
project: protocol-compiler

subjects:
  generated-files:
    kind: codebase
    audiences: [developer, coding-agent, docs-reader]

assessments:
  generated-docs:
    subject: generated-files
    assessor: generator-check@1
    target: {kind: revision, environments: [local, ci], selection: merge_result}
    observation:
      kind: snapshot
      command: task docs-check
      conditions:
        all:
          tools: {ess: {version: "0.97.4"}}
      coverage: {executed: {min: 18}, skipped: {max: 0}}
    measurements:
      digest: {kind: exact, output: digest, scope: file}

  regenerated-scenarios:
    subject: generated-files
    assessor: generator-check@1
    target: {kind: revision, environments: [local, ci], selection: merge_result}
    observation:
      kind: snapshot
      command: task test-slow
      conditions:
        all:
          tools: {ess: {version: "0.97.4"}}
      coverage: {skipped: {max: 0}}
    measurements:
      digest: {kind: exact, output: digest, scope: file}

requirements:
  generated-docs-current:
    assessment: generated-docs
    reference: {kind: generated, paths: ["docs/reference/**"]}
  scenario-files-current:
    assessment: regenerated-scenarios
    reference: {kind: generated, paths: ["conformance/scenarios/**"]}

gates:
  merge:
    stage: pre-merge
    qualifying_environments: [local, ci]
    requires:
      - generated-docs-current
      - {requirement: scenario-files-current, when: {changed: ["spec/**", "conformance/**"]}}
  promote:
    stage: pre-promotion
    qualifying_environments: [ci]
    requires: [scenario-files-current]
