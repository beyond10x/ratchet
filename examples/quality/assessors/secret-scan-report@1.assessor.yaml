format: ratchet-assessor/1
name: secret-scan-report
version: "1"
command: secret-scan-report
targets: [revision]
inputs:
  report: {type: path, required: true}
conditions: []
coverage_unit: file
coverage: [executed, skipped]
outputs:
  findings:
    value_type: identity_set
    kind: exact
    scopes: []
    identity_key: [rule, path]
