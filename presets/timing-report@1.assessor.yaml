format: ratchet-assessor/1
name: timing-report
version: "1"
command: timing-report
targets: [revision]
inputs:
  report: {type: path, required: true}
  workload: {type: string, required: true}
conditions: []
coverage_unit: request
coverage: [executed, not_run, passed, failed]
outputs:
  duration:
    value_type: number
    kind: sampled
    scopes: [operation]
    unit: ms
    boundaries: [request_start_to_response_complete, request_start_to_event_observed]
  throughput: {value_type: number, kind: sampled, scopes: [], unit: requests/s}
