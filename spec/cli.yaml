format: ess-cli/2
binary: ratchet
about: Specify software quality, assess it, and keep it from going backwards
# Commands: docs/design.md revision 4, § 5 "Proposed CLI" (init, validate, assess, evaluate,
# reference propose, reference adopt, prove, render, status, explain, diff, exceptions, doctor,
# history, import, serve). Every name, flag and field is a proposal.
#
# Globals: `--config` is the local config `ratchet.toml` (design § 5 "Local config"),
# `--state-dir` the local state such as an index over the records (docs/product-brainstorm.md
# § 6), `--output` human or json. None of them enters a command payload.
#
# Every callable is a local action: the handler reads the specification, the record store and
# the tools in this process. No ESS component serves them.
#
# ess-cli/2 has no valueless flag and no repeated option: `--check true` and a JSON list such
# as `--presets '["web-ux@1"]'` are how the generated parser spells them.
#
# Exit status: success is 0, a declared error 1, an argument or input refusal 2. A gate that
# does not pass is a declared error (`gate_failed`, `insufficient_evidence`), so CI enforces the
# exit status; both are 1 and the JSON code tells them apart.
globals:
  config: config
  state: state-dir
  output: output
callables:
  init:
    target: {kind: local, owner: ratchet.cli, action: init}
    input: ratchet.cli.InitInput
    result: ratchet.cli.InitResult
    errors:
      spec_exists: ratchet.cli.Refusal
      preset_unresolved: ratchet.cli.Refusal
  validate:
    target: {kind: local, owner: ratchet.cli, action: validate}
    input: ratchet.cli.ValidateInput
    result: ratchet.cli.ValidationReport
    errors:
      spec_invalid: ratchet.cli.ValidationReport
      spec_unreadable: ratchet.cli.Refusal
  assess:
    target: {kind: local, owner: ratchet.cli, action: assess}
    input: ratchet.cli.AssessInput
    result: ratchet.cli.AssessResult
    # `input_not_local`: `[inputs.<assessment>]` in `ratchet.toml` sets an input that the plan's
    # assessor does not declare as local (design § 5 "Local config" rule 6).
    errors:
      input_not_local: ratchet.cli.Refusal
      unknown_assessment: ratchet.cli.Refusal
      assessor_unavailable: ratchet.cli.Refusal
      record_store_unreachable: ratchet.cli.Refusal
  evaluate:
    target: {kind: local, owner: ratchet.cli, action: evaluate}
    input: ratchet.cli.EvaluateInput
    result: ratchet.cli.GateReport
    # `local_skips_refused`: outside the class `local` (and always when a CI environment is
    # detected) a `ratchet.toml` that carries `[local]` skips is refused, naming the key; the
    # section is not ignored (design § 5 "Local config" rule 3). An operational gate takes no
    # candidate and assesses its time-window plans first, each window ending at the evaluation
    # (design § 5 "Gate kinds"); `--candidate` with one is `operational_gate_takes_no_candidate`,
    # a name this specification proposes.
    errors:
      gate_failed: ratchet.cli.GateReport
      insufficient_evidence: ratchet.cli.GateReport
      unknown_gate: ratchet.cli.Refusal
      operational_gate_takes_no_candidate: ratchet.cli.Refusal
      record_store_unreachable: ratchet.cli.Refusal
      local_skips_refused: ratchet.cli.Refusal
  # `reference propose` writes nothing; `reference adopt` writes what propose prints, into the
  # working tree (design § 5 "Reference records"; D1 decided A: files in the tree).
  reference-propose:
    target: {kind: local, owner: ratchet.cli, action: reference-propose}
    input: ratchet.cli.ProposeInput
    result: ratchet.cli.ReferenceProposal
    errors:
      unknown_requirement: ratchet.cli.Refusal
      no_qualifying_evidence: ratchet.cli.Refusal
      not_better: ratchet.cli.Refusal
      gain_not_shown: ratchet.cli.Refusal
      unnamed_regression: ratchet.cli.Refusal
  reference-adopt:
    target: {kind: local, owner: ratchet.cli, action: reference-adopt}
    input: ratchet.cli.ProposeInput
    result: ratchet.cli.AdoptResult
    errors:
      unknown_requirement: ratchet.cli.Refusal
      no_qualifying_evidence: ratchet.cli.Refusal
      not_better: ratchet.cli.Refusal
      gain_not_shown: ratchet.cli.Refusal
      unnamed_regression: ratchet.cli.Refusal
  prove:
    target: {kind: local, owner: ratchet.cli, action: prove}
    input: ratchet.cli.ProveInput
    result: ratchet.cli.ProofReport
    errors:
      defect_accepted: ratchet.cli.ProofReport
      no_planted_defects: ratchet.cli.Refusal
      unknown_requirement: ratchet.cli.Refusal
  render:
    target: {kind: local, owner: ratchet.cli, action: render}
    input: ratchet.cli.RenderInput
    result: ratchet.cli.RenderReport
    errors:
      render_drift: ratchet.cli.RenderReport
      unknown_record: ratchet.cli.Refusal
  status:
    target: {kind: local, owner: ratchet.cli, action: status}
    input: ratchet.cli.StatusInput
    result: ratchet.cli.StatusReport
    errors:
      unknown_gate: ratchet.cli.Refusal
      record_store_unreachable: ratchet.cli.Refusal
  explain:
    target: {kind: local, owner: ratchet.cli, action: explain}
    input: ratchet.cli.ExplainInput
    result: ratchet.cli.Explanation
    errors:
      unknown_requirement: ratchet.cli.Refusal
  history:
    target: {kind: local, owner: ratchet.cli, action: history}
    input: ratchet.cli.HistoryInput
    result: ratchet.cli.History
    errors:
      unknown_requirement: ratchet.cli.Refusal
      record_store_unreachable: ratchet.cli.Refusal
  diff:
    target: {kind: local, owner: ratchet.cli, action: diff}
    input: ratchet.cli.DiffInput
    result: ratchet.cli.DiffReport
    errors:
      unknown_requirement: ratchet.cli.Refusal
      reference_missing: ratchet.cli.Refusal
  doctor:
    target: {kind: local, owner: ratchet.cli, action: doctor}
    input: null
    result: ratchet.cli.DoctorReport
    errors:
      unhealthy: ratchet.cli.DoctorReport
  import:
    target: {kind: local, owner: ratchet.cli, action: import}
    input: ratchet.cli.ImportInput
    result: ratchet.cli.ImportResult
    errors:
      source_unreadable: ratchet.cli.Refusal
      unknown_assessment: ratchet.cli.Refusal
      record_store_unreachable: ratchet.cli.Refusal
  exceptions:
    target: {kind: local, owner: ratchet.cli, action: exceptions}
    input: ratchet.cli.ExceptionsInput
    result: ratchet.cli.ExceptionList
    errors:
      unknown_requirement: ratchet.cli.Refusal
  serve:
    target: {kind: local, owner: ratchet.cli, action: serve}
    input: ratchet.cli.ServeInput
    result: ratchet.cli.ServeResult
    errors:
      listen_failed: ratchet.cli.Refusal
      record_store_unreachable: ratchet.cli.Refusal
commands:
  - path: [init]
    callable: init
    about: Create a project specification and bind selected catalog presets
    arguments:
      - {field: project, source: {kind: option, long: project}}
      - {field: presets, source: {kind: option, long: presets}}
      - {field: path, source: {kind: option, long: path}}
  - path: [validate]
    callable: validate
    about: Check the specification, resolve references and validate assessor configuration
    arguments:
      - {field: spec, source: {kind: option, long: spec}}
  - path: [assess]
    callable: assess
    about: Run selected assessors or ingest their results and record structured evidence
    arguments:
      - {field: assessments, source: {kind: option, long: assessments}}
      - {field: candidate, source: {kind: option, long: candidate}}
      - {field: report, source: {kind: option, long: report}}
  - path: [evaluate]
    callable: evaluate
    about: Evaluate a named gate with qualifying evidence, or an operational gate over its windows; only a pass exits 0
    arguments:
      - {field: gate, source: {kind: option, long: gate}}
      - {field: candidate, source: {kind: option, long: candidate}}
      - {field: trusted, source: {kind: option, long: trusted}}
  - path: [reference, propose]
    callable: reference-propose
    about: Print a stronger protected reference, or a trade-off that names its gains; write nothing
    arguments:
      - {field: requirement, source: {kind: positional, index: 1}}
      - {field: gains, source: {kind: option, long: gains}}
      - {field: trade_off, source: {kind: option, long: trade-off}}
      - {field: reason, source: {kind: option, long: reason}}
      - {field: owner, source: {kind: option, long: owner}}
  - path: [reference, adopt]
    callable: reference-adopt
    about: Write the proposed reference records, and the trade-off record, into the working tree
    arguments:
      - {field: requirement, source: {kind: positional, index: 1}}
      - {field: gains, source: {kind: option, long: gains}}
      - {field: trade_off, source: {kind: option, long: trade-off}}
      - {field: reason, source: {kind: option, long: reason}}
      - {field: owner, source: {kind: option, long: owner}}
  - path: [prove]
    callable: prove
    about: Run a requirement's planted defects and record that the check refuses each
    arguments:
      - {field: requirement, source: {kind: positional, index: 1}}
  - path: [render]
    callable: render
    about: Write the marked blocks of numbers in documents and the static export from records
    arguments:
      - {field: documents, source: {kind: option, long: documents}}
      - {field: export, source: {kind: option, long: export}}
      - {field: check, source: {kind: option, long: check}}
  - path: [status]
    callable: status
    about: Show every requirement's verdict, value, limit or reference, and when it was checked
    arguments:
      - {field: gate, source: {kind: option, long: gate}}
  - path: [explain]
    callable: explain
    about: Say what a requirement means, who cares, how it is measured and where its evidence is
    arguments:
      - {field: requirement, source: {kind: positional, index: 1}}
  - path: [history]
    callable: history
    about: Show a requirement's series with reference changes and exceptions marked
    arguments:
      - {field: requirement, source: {kind: positional, index: 1}}
      - {field: limit, source: {kind: option, long: limit}}
  - path: [diff]
    callable: diff
    about: Compare the candidate with the reference item by item
    arguments:
      - {field: requirement, source: {kind: positional, index: 1}}
      - {field: candidate, source: {kind: option, long: candidate}}
  - path: [doctor]
    callable: doctor
    about: Check that config, specifications, tools, local inputs and the record store are reachable
    arguments: []
  - path: [import]
    callable: import
    about: Import history that exists elsewhere as assessment runs
    arguments:
      - {field: source, source: {kind: positional, index: 1}}
      - {field: assessment, source: {kind: option, long: assessment}}
      - {field: path, source: {kind: option, long: path}}
      - {field: since, source: {kind: option, long: since}}
  - path: [exceptions]
    callable: exceptions
    about: List active, expiring and expired exceptions
    arguments:
      - {field: status, source: {kind: option, long: status}}
      - {field: within_days, source: {kind: option, long: within-days}}
      - {field: requirement, source: {kind: option, long: requirement}}
  - path: [serve]
    callable: serve
    about: Serve the page and data document of the views over the record store
    arguments:
      - {field: listen, source: {kind: option, long: listen}}
