domain: ratchet.assessor

summary: >-
  Assessors: built-in or separately packaged adapters that run a check or read an existing
  result and return structured evidence (docs/design.md § 1, § 2, § 4). An assessor is declared
  in one document of the format `ratchet-assessor/1` per assessor and version
  (docs/evidence-format.md § 10, E8). A project pins the assessor versions it uses; no Ratchet
  command creates an assessor.

# Sources: `§` is a section of docs/design.md; `format §` is a section of
# docs/evidence-format.md, whose § 10 lists every member of the declaration, the invocation and
# the exit statuses. `spec/record-fields.test.sh` checks that every field row of the two
# declaration tables is declared here under the name the row gives.
#
# Where a declaration is found: the file `<name>@<version>.assessor.yaml` in a source of
# `[catalog] sources` of the local config (`ratchet.config.CatalogSource`).
#
# Built-in assessor `record-series@1` (design § 3 "A series of runs as a population"): it reads
# the runs of a source plan (`population: {runs_of, from}`) from the record store. Its outputs
# are the measurements of the source plan, by name, so it declares no fixed output list: a
# measurement of a window plan keeps the scope, unit and direction of the source measurement.
# Only runs that qualified under the source plan (conditions, coverage) enter the population, and
# the run records the runs left out. It takes no configuration input and no population fields.
# `ratchet.specification.AssessmentPlan` holds the rule that a plan over `runs_of` names it and
# that it is named only over `runs_of`. ESS declares no instance of a provided entity, so this
# comment and that invariant are its declaration.
# UNMAPPED: the design gives `record-series@1` no coverage unit. A run of the source plan is the
# piece of work its window counts, so `run` is the reading; open question for the owner.

types:
  - name: ratchet.assessor.CoverageUnit
    kind: newtype
    of: String
    naming:
      summary: >-
        The piece of work a run executes or skips, such as a walk, a test, a file or a crate
        (§ 1, § 3 "Evidence coverage"). An assessor declares one; it need not be the scope of a
        measurement, and `executed_ids` are ids of it.

  # The counts § 3 "Evidence coverage" names, next to passed and failed.
  - name: ratchet.assessor.CoverageCount
    kind: enum
    variants: [executed, skipped, not_run, unsupported, passed, failed]

  # format § 10 "Invocation" (E7, taken as A): Ratchet runs the assessor's command once per run
  # of a plan, in the root of the tree that is assessed, and every value is an argument,
  # `--name value`. These six names are Ratchet's: `--project` and `--assessment` (the
  # assessor writes them as `evidence.project` and `evidence.assessment`), `--root` (paths in
  # `evidence` are relative to it), `--class` (`evidence.target.class`), `--out` (the file the
  # document is written to), and for a target of the kind `revision`, `--revision`
  # (`evidence.candidate` and `evidence.target.revision`); for a target of the kind `build`,
  # `--revision` is the revision the artifact was built from (`evidence.target.revision`).
  # Beside them Ratchet passes one `--<input>` per declared input that has a value, and for a
  # time-window plan over a population outside the record store one argument per field of its
  # `population: {filter}`: each field is passed as `--<field> <value>`, under a name of
  # `Assessor.population_fields`. Nothing else. An assessor declares no input with one of these names or with the name of a
  # population field, and a new reserved argument is a new version of the declaration format.
  - name: ratchet.assessor.ReservedArgument
    kind: enum
    variants: [project, assessment, root, class, out, revision]

  # format § 10 "Invocation": the keys of a plan's `observation` whose value Ratchet passes as
  # an input of the assessor, the one that `Assessor.observation_inputs` names for the key. A
  # closed list: a key outside it is passed to no assessor. `scenarios`, `workload`, `command`,
  # `runs` and `min_samples` are the members of `ratchet.specification.ObservationPlan` of the
  # same names. The window of a time-window plan: `window_length` and `window_last` are the
  # `length` and the `last` of its `window` (`ratchet.specification.WindowSpec`), and
  # `window_ends_at` is the instant the plan is assessed, at which the window ends (§ 3 "Time
  # windows"). A record's `target.window` lies inside the window passed.
  - name: ratchet.assessor.ObservationKey
    kind: enum
    variants: [scenarios, workload, command, runs, min_samples, window_length, window_last, window_ends_at]

  # format § 10 "Exit status": what an assessor's exit means, and the completion the CLI records
  # for it (`ratchet.evidence.RunCompletion`). The exit status is no verdict: a document with
  # findings is written with exit 0.
  #   ended (0): the document is at `--out`; the CLI records that document after it checks the
  #     rules of format § 4 and the declaration. A missing document, or one that breaks a rule,
  #     is recorded as `stopped_by_infrastructure`.
  #   refused_inputs (1): a file is unreadable or malformed, or the inputs do not belong
  #     together; no document; recorded as `refused_inputs` (E9, taken as A).
  #   wrong_invocation (2): an argument the assessor does not know, a required one missing, a
  #     value a reserved argument cannot have; no document; recorded as
  #     `stopped_by_infrastructure`: the declaration and the program do not match.
  #   broke (any other status, or a signal): the assessor or a tool under it broke; no
  #     document; recorded as `stopped_by_infrastructure`.
  # Two completions have no exit status, because the CLI decides them: `timed_out` for an
  # assessor it ended at its time limit, and `skipped_locally` for one it did not start.
  - name: ratchet.assessor.AssessorExit
    kind: enum
    variants: [ended, refused_inputs, wrong_invocation, broke]

  - name: ratchet.assessor.AssessorOutput
    kind: struct
    naming:
      summary: >-
        One output an assessor declares (§ 4 "Outputs"), an entry of `outputs` under the
        output's name, such as `findings` or `duration`: the value type, the kind, the scopes,
        the unit or that the output has none, the boundaries of a duration, and the identity
        key of a set, the fields of its items and the values of those fields that are a closed
        list. `ratchet validate` checks a measurement's output, kind, scope, unit, boundary,
        identity key, filter fields and filter values against it, and the
        CLI checks each result of an evidence document against it. Coverage is declared once for
        the assessor, not per output (§ 4 "Coverage").
    fields:
      - name: value_type
        type: ratchet.specification.ValueType
      - name: kind
        type: ratchet.specification.MeasurementKind
      - name: scopes
        type: List<ratchet.specification.Scope>
        summary: >-
          The scopes a result of this output can belong to, beside `run`, which every assessor
          has. The scope items are not declared: they come from the inputs of a run. The list
          may be empty: `scopes: []` declares an output whose results have the scope `run`
          alone. The field stays required, so such an output writes the empty list.
      - name: unit
        type: Optional<ratchet.specification.Unit>
        summary: >-
          Absent declares that the output has no unit, such as a layout shift, a ratio or the
          number of items of a set; a measurement of it then takes no `unit` (§ 3).
      - name: boundaries
        type: Optional<List<ratchet.specification.Boundary>>
        summary: >-
          For a duration, the parts it reports, such as `run_time`, `queue_wait` or
          `request_start_to_response_complete` (§ 3).
      - name: cells
        type: Optional<List<String>>
        summary: >-
          The conditions its results are split by, such as `[viewport, theme]`. A result of
          this output has a `cell` exactly when the output declares `cells`, with those names
          (format § 3, § 10).
      - name: identity_key
        type: Optional<List<String>>
        summary: >-
          The fields of an item's `identity`; present exactly for the value type
          `identity_set` (§ 4).
      - name: item_fields
        type: Optional<List<String>>
        summary: >-
          The names an item of a set may have under `fields`, which a measurement's `filter`
          may read, such as `severity` (§ 3, § 4).
      - name: item_values
        type: Optional<Map<String, List<String>>>
        summary: >-
          The closed list of values of an item field, keyed by a name of `item_fields`, such as
          `{class: [equal, allowed, different]}`. A measurement's `filter` on that field names
          only these values, and an item of a result has one of them under that field. A field
          without a list stays open: any value is read (format § 10).
    invariants:
      - any: ["value_type != identity_set", "defined(identity_key)"]
      - any: ["value_type == identity_set", "not defined(identity_key)"]

entities:
  - name: ratchet.assessor.Assessor
    naming:
      summary: >-
        A tool or adapter that runs a check or reads an existing result and returns structured
        evidence (§ 1). Its declaration is one YAML document of the format `ratchet-assessor/1`
        per assessor and version, kept with the assessor: supported targets, inputs, outputs, a
        coverage unit and a version (§ 4; format § 10). `ratchet validate` checks a plan against
        it, and the CLI checks every evidence document against it, so a declaration that
        disagrees with its program is an error at the first run and not a wrong verdict. A
        review assessor imports a review's findings as an identity set tied to the revision the
        review judged. The built-in `record-series@1` reads the runs of another plan (comment
        at the top of this file).
    provided: true
    identity:
      name: assessor
      type: ratchet.specification.AssessorRef
    fields:
      - name: format
        type: String
        summary: "`ratchet-assessor/1`. The version covers the invocation too."
      - name: name
        type: String
        summary: The part of `ux-static@1` before the `@`.
      - name: version
        type: String
        summary: The part after the `@`.
      - name: command
        type: Optional<String>
        summary: >-
          The program, for an assessor that Ratchet runs. `[tools]` of the local config says
          how it is started on one machine (§ 5).
      - name: targets
        type: List<ratchet.specification.TargetKind>
        summary: The target kinds it supports.
      - name: target_input
        type: Optional<String>
        summary: >-
          The input that holds the path of the target document, or of the artifact of a target
          of the kind `build`; present where `targets` holds `document`, and admitted only
          where `targets` holds `document` or `build`. The assessor writes the digest of that
          file as `candidate` and under `target.identifiers` (`artifact_digest` for `build`),
          and does not repeat it under `inputs`.
      - name: inputs
        type: Optional<Map<String, ratchet.specification.InputDeclaration>>
        summary: >-
          The inputs by name: the workflow to read, the path of a report, an exclusion the tool
          applies (§ 4). A plan passes those that are not local as `inputs`. An input declared
          `local` is not passed by the plan; the local config supplies it under
          `[inputs.<assessment>]`, such as `job_log` of `command-timing@1` (§ 3, § 5 rule 6).
          No input is named as a `ReservedArgument`.
      - name: observation_inputs
        type: Optional<Map<String, String>>
        summary: >-
          A map from a key of the plan's `observation`, a value of
          `ratchet.assessor.ObservationKey`, to the name of an input it declares under
          `inputs`. Ratchet passes the value of that key of the plan as that input, so the plan
          writes it once, under `observation`, and passes no value to that input under
          `inputs`; an input named here is no reserved argument, and Ratchet passes it as
          `--<input>` like every other (format § 10 "Invocation"). A result of a plan whose
          assessor maps `runs` carries `runs`.
      - name: revision_inputs
        type: Optional<List<String>>
        summary: >-
          The inputs whose file states the revision it was produced from, such as an imported
          report: names of `inputs`. The assessor reads that revision from the file and writes
          it as `evidence.inputs.<input>.revision`. A file named here that states no revision
          is refused: the assessor exits 1, which the CLI records as `refused_inputs` (format
          § 10 "Exit status", E9). A file whose revision is not the candidate's is refused by
          `ratchet assess`, with a cause that names both. The digest of the sources a file was
          produced from is left out (format § 9).
      - name: conditions
        type: Optional<List<String>>
        summary: >-
          The observation conditions it declares beyond `host_load_per_cpu`, `tools` and
          `runner`, such as `cache_profile` (§ 3). Absent or empty: it declares none. A plan
          and a declaration write the cache condition as `cache_profile`, the member of the
          record, and under no other name.
      - name: coverage_unit
        type: ratchet.assessor.CoverageUnit
        summary: >-
          The one unit its coverage counts count, such as the unit of `ux-eval@1` that
          `executed: {min: 3}` of `search-ui` counts, or `test` for `command-timing@1` (§ 3).
      - name: coverage
        type: List<ratchet.assessor.CoverageCount>
        summary: >-
          The coverage counts it reports, for the assessor as a whole: a run has one set of
          counts, whichever outputs a plan reads (§ 4 "Coverage"). The assessor leaves a count
          it does not report out of its documents, where the count is not known (format § 4
          rule 4).
      - name: outputs
        type: Map<String, ratchet.assessor.AssessorOutput>
        summary: >-
          The outputs a measurement can read, by output name
          (`ratchet.specification.OutputName`).
      - name: population_fields
        type: Optional<List<String>>
        summary: >-
          The fields a time-window plan's `population: {filter}` may name, for an assessor that
          reads a population outside the record store, such as `service` and `region` of
          production telemetry (§ 3 "Time windows", value lists). Each field of the plan's
          filter is passed as `--<field> <value>` (format § 10 "Invocation"), so the
          declaration declares no input with such a name.
    invariants:
      - "format == \"ratchet-assessor/1\""
      - any:
          - "not defined(target_input)"
          - exists: {in: targets, as: t, that: "t == document"}
          - exists: {in: targets, as: t, that: "t == build"}
      - any:
          - "defined(target_input)"
          - not:
              exists: {in: targets, as: t, that: "t == document"}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]
