domain: ratchet.assessor

summary: >-
  Assessors: built-in or separately packaged adapters that run a check or read an existing
  result and return structured evidence (docs/design.md § 1, § 2, § 4). A project pins the
  assessor versions it uses; no Ratchet command creates an assessor.

types:
  # The counts § 3 "Evidence coverage" names, next to passed and failed.
  - name: ratchet.assessor.CoverageCount
    kind: enum
    variants: [executed, skipped, not_run, unsupported, passed, failed]

  - name: ratchet.assessor.AssessorOutput
    kind: struct
    naming:
      summary: >-
        One output an assessor declares (§ 4 "Custom assessors"): the value type, the kind,
        the scopes, the unit, the boundaries of a duration, the identity key of a set and the
        fields of its items, and the coverage counts it reports. `ratchet validate` checks a
        measurement's output, scope, unit, boundary and filter fields against it.
    fields:
      - name: name
        type: ratchet.specification.OutputName
        summary: The output a measurement reads, such as `findings` or `duration`.
      - name: value_type
        type: ratchet.specification.ValueType
      - name: kind
        type: ratchet.specification.MeasurementKind
      - name: scopes
        type: List<ratchet.specification.Scope>
        summary: The scopes a result of this output can belong to; `run` is always one.
      - name: unit
        type: Optional<ratchet.specification.Unit>
      - name: boundaries
        type: Optional<List<ratchet.specification.Boundary>>
        summary: >-
          For a duration, the parts it reports, such as `run_time`, `queue_wait` or
          `request_start_to_response_complete` (§ 3).
      - name: identity_key
        type: Optional<List<String>>
        summary: The identity key of each set the output returns (§ 4).
      - name: item_fields
        type: Optional<List<String>>
        summary: >-
          The fields of the items of a set, which a measurement's `filter` may read, such as
          `severity` (§ 3, § 4).
      - name: coverage
        type: List<ratchet.assessor.CoverageCount>

entities:
  - name: ratchet.assessor.Assessor
    naming:
      summary: >-
        A tool or adapter that runs a check or reads an existing result and returns structured
        evidence (§ 1). It declares supported targets, configuration inputs, output types and
        a version (§ 4). A review assessor imports a review's findings as an identity set tied
        to the revision the review judged.
    provided: true
    identity:
      name: assessor
      type: ratchet.specification.AssessorRef
    fields:
      - name: name
        type: String
      - name: version
        type: String
      - name: supported_targets
        type: List<ratchet.specification.TargetKind>
      - name: configuration_inputs
        type: List<ratchet.specification.InputDeclaration>
        summary: >-
          The inputs a plan passes as `inputs`: the workflow to read, the path of a report, an
          exclusion the tool applies (§ 4).
      - name: conditions
        type: Optional<List<String>>
        summary: >-
          The observation conditions it declares beyond `host_load_per_cpu`, `tools` and
          `runner`, such as `cache` (§ 3).
      - name: outputs
        type: List<ratchet.assessor.AssessorOutput>
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]
