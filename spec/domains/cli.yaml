domain: ratchet.cli

summary: >-
  The typed inputs, results and refusals of the `ratchet` command line, which the ess-cli/2
  binding in `spec/cli.yaml` presents (docs/design.md § 5 "Proposed CLI"). A presentation
  projection over the other domains, not a model of its own: it declares no entity.

# ess-cli projects String, Boolean, Integer, enums, unconstrained newtypes and structs,
# Optional, List, string-keyed Map, and Json in results only, never in error data. A Timestamp
# is therefore written here as RFC 3339 text and a decimal as its exact text (§ 5 "Typed
# reports"). A measured value is the JSON of the value members of a
# `ratchet.evidence.MeasurementResult` in results that are never error data, and a `ValueRow`
# or `LimitRow` in those that are (the gate report). ess-cli also refuses a struct that
# declares invariants, so the coverage of a run is a `CoverageRow` here and not
# `ratchet.evidence.EvidenceCoverage`. The row has every field of that struct and none of its
# invariants; `spec/cli-coverage-row.test.sh` fails when a field is missing or has another
# type, or when a result that reports coverage is not typed with the row.

types:
  - name: ratchet.cli.Refusal
    kind: struct
    naming:
      summary: >-
        Why a command refused, and the next step: what to fix or which evidence to recover
        (design § 5). It never repeats an argument value.
    fields:
      - name: detail
        type: String
      - name: next_step
        type: Optional<String>

  # A value without Json, for result types that are also error data (`gate_failed` carries the
  # gate report), where ess-cli refuses Json. Decimal numbers are their exact decimal text.
  - name: ratchet.cli.ValueRow
    kind: struct
    fields:
      - name: value_type
        type: ratchet.specification.ValueType
      - name: number
        type: Optional<String>
      - name: unit
        type: Optional<ratchet.specification.Unit>
      - name: at_least
        type: Optional<Boolean>
      - name: items
        type: Optional<Integer>
        summary: The item count of an identity set; `ratchet diff` lists the items.
      - name: digest
        type: Optional<String>
      - name: holds
        type: Optional<Boolean>

  - name: ratchet.cli.LimitRow
    kind: struct
    fields:
      - name: operator
        type: ratchet.specification.ComparisonOperator
      - name: value
        type: Optional<String>
      - name: min
        type: Optional<String>
        summary: >-
          The lower bound of a range with the operator `within`, the exact decimal text as
          `value` is, so a range is one limit.
      - name: max
        type: Optional<String>
        summary: The upper bound of a range with the operator `within`, as `min`.
      - name: unit
        type: Optional<ratchet.specification.Unit>
      - name: source
        type: Optional<ratchet.specification.NumberSource>
        summary: >-
          The source of the limit as the condition states it, printed beside the allowed value;
          absent where the condition states none.

  - name: ratchet.cli.CoverageRow
    kind: struct
    naming:
      summary: >-
        The coverage of a run as a command reports it: every field of
        `ratchet.evidence.EvidenceCoverage`, under the same name and with the same type, the
        two lists of ids included (§ 3 "Evidence coverage").
    fields:
      - name: unit
        type: ratchet.assessor.CoverageUnit
      - name: executed
        type: Optional<Integer>
      - name: skipped
        type: Optional<Integer>
      - name: not_run
        type: Optional<Integer>
      - name: unsupported
        type: Optional<Integer>
      - name: passed
        type: Optional<Integer>
      - name: failed
        type: Optional<Integer>
      - name: at_least
        type: Optional<List<ratchet.assessor.CoverageCount>>
        summary: >-
          The counts whose value is a lower bound. A count that is absent above is not known.
      - name: executed_ids
        type: Optional<List<String>>
        summary: The ids of the executed units, where the plan declares `executed_ids`.
      - name: not_executed
        type: Optional<List<ratchet.evidence.NotExecutedUnit>>
        summary: The units that were not executed, each with its state and reason.

  # init ---------------------------------------------------------------------------------------
  - name: ratchet.cli.InitInput
    kind: struct
    fields:
      - name: project
        type: Optional<ratchet.specification.ProjectName>
      - name: presets
        type: Optional<List<ratchet.specification.PresetRef>>
        summary: Catalog presets to bind, each pinned, such as `web-ux@1`.
      - name: path
        type: Optional<String>
        summary: Where to write the project specification; `ratchet.yaml` by default.

  - name: ratchet.cli.InitResult
    kind: struct
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: spec_path
        type: String
      - name: presets
        type: List<ratchet.specification.PresetRef>

  # validate -----------------------------------------------------------------------------------
  - name: ratchet.cli.ValidateInput
    kind: struct
    fields:
      - name: spec
        type: Optional<String>
        summary: One specification file; by default every path of `[spec] paths` in `ratchet.toml`.

  - name: ratchet.cli.ValidationLayer
    kind: enum
    variants: [shape, completeness]

  # design § 2, § 3, § 4, § 5: what `ratchet validate` refuses or reports. Added for revision 4:
  # `unit_missing` and `unit_not_declared` (§ 3: a number has a unit exactly when the assessor
  # declares one), `population_field_mismatch` (§ 3 value lists), `time_window_incomplete` and
  # `window_on_other_kind` (§ 3 "Time windows"), `plan_does_not_fit_gate_kind` and
  # `when_in_operational_gate` (§ 5 "Gate kinds"), `local_input_in_specification` (§ 5 rule 6)
  # and `preset_input_local` (§ 4). The names are this specification's proposals.
  - name: ratchet.cli.ValidationCode
    kind: enum
    variants:
      - schema_violation
      - unresolved_reference
      - duplicate_id
      - kind_mismatch
      - unit_mismatch
      - unit_missing
      - unit_not_declared
      - population_field_mismatch
      - time_window_incomplete
      - window_on_other_kind
      - plan_does_not_fit_gate_kind
      - when_in_operational_gate
      - local_input_in_specification
      - preset_input_local
      - scope_mismatch
      - boundary_mismatch
      - target_binding_mismatch
      - assessor_configuration_invalid
      - preset_digest_mismatch
      - preset_input_invalid
      - sampled_without_conditions
      - number_reference_without_better
      - sampled_reference_without_tolerance
      - sampled_reference_without_adoption
      - report_mode_without_since
      - requirement_without_qualifying_environment
      - exception_without_reason
      - exception_without_owner
      - exception_without_expiry
      - statement_not_served

  - name: ratchet.cli.ValidationFinding
    kind: struct
    fields:
      - name: code
        type: ratchet.cli.ValidationCode
      - name: layer
        type: ratchet.cli.ValidationLayer
      - name: location
        type: String
        summary: The file and key path, such as `ratchet.yaml:assessments.test-step`.
      - name: message
        type: String

  - name: ratchet.cli.ValidationReport
    kind: struct
    fields:
      - name: valid
        type: Boolean
      - name: specs
        type: List<String>
      - name: findings
        type: List<ratchet.cli.ValidationFinding>

  # assess -------------------------------------------------------------------------------------
  - name: ratchet.cli.AssessInput
    kind: struct
    fields:
      - name: assessments
        type: Optional<List<ratchet.specification.AssessmentName>>
        summary: The assessment plans to run; every plan by default, less the `[local] skip` ones.
      - name: candidate
        type: Optional<ratchet.specification.Revision>
        summary: >-
          The candidate revision. Where the candidate of a plan cannot be resolved, as for a
          target document that does not exist, the command records no run for that plan and
          reports the error `candidate_unresolved`: a run without its candidate is evidence
          about nothing (docs/evidence-format.md § 10).
      - name: report
        type: Optional<String>
        summary: A result file an assessor ingests instead of running its tool (§ 5).

  - name: ratchet.cli.ResultRow
    kind: struct
    fields:
      - name: measurement
        type: ratchet.specification.MeasurementName
      - name: output
        type: ratchet.specification.OutputName
      - name: kind
        type: ratchet.specification.MeasurementKind
      - name: scope
        type: ratchet.specification.Scope
      - name: item
        type: Optional<String>
        summary: The scope item; absent at the scope `run`.
      - name: value
        type: Json
        summary: >-
          The value members of the `ratchet.evidence.MeasurementResult`: `value_type` and the
          members of that type, with `incomplete` where the result has it.

  - name: ratchet.cli.RunSummary
    kind: struct
    fields:
      - name: run
        type: ratchet.evidence.RunId
      - name: assessment
        type: ratchet.specification.AssessmentName
      - name: completion
        type: ratchet.evidence.RunCompletion
        summary: >-
          `skipped_locally` is reported as "skipped locally by ratchet.toml" (§ 5). An assessor
          that exits 1 is recorded as `refused_inputs`; one that exits with another non-zero
          status, ends on a signal or leaves no valid document as `stopped_by_infrastructure`
          (`ratchet.assessor.AssessorExit`).
      - name: target_class
        type: ratchet.specification.TargetClass
      - name: coverage
        type: ratchet.cli.CoverageRow
      - name: results
        type: List<ratchet.cli.ResultRow>
      - name: local_inputs
        type: Map<String, String>
        summary: The resolved value of each local input, as the run records it (§ 5 rule 6).
      - name: window
        type: Optional<ratchet.cli.WindowRow>
        summary: For a time-window plan, the window the run read.

  - name: ratchet.cli.AssessResult
    kind: struct
    fields:
      - name: runs
        type: List<ratchet.cli.RunSummary>

  # evaluate -----------------------------------------------------------------------------------
  - name: ratchet.cli.EvaluateInput
    kind: struct
    fields:
      - name: gate
        type: ratchet.specification.GateName
      - name: candidate
        type: Optional<ratchet.specification.Revision>
        summary: >-
          The candidate revision of a candidate gate; the working tree's HEAD by default. An
          operational gate takes no candidate (§ 5 "Gate kinds"), and one given is refused
          (`operational_gate_takes_no_candidate`).
      - name: trusted
        type: Optional<ratchet.specification.Revision>
        summary: >-
          The trusted revision whose policy and accepted references judge the candidate, such
          as `main` (§ 5 rule 1). Absent: the policy is read at the merge base of `HEAD` and
          `origin/main` (§ 5 "Proposed CLI").

  - name: ratchet.cli.WindowRow
    kind: struct
    naming:
      summary: >-
        The window a time-window run read (§ 3, § 6): its exact bounds as RFC 3339 text, the
        number of population items, the time of the newest and the runs left out.
    fields:
      - name: starts_at
        type: String
      - name: ends_at
        type: String
      - name: items
        type: Integer
      - name: newest_at
        type: Optional<String>
      - name: left_out
        type: Integer

  - name: ratchet.cli.VerdictRow
    kind: struct
    naming:
      summary: >-
        One gate entry in the report, with the same typed fields for a pass, a non-pass and an
        entry that is not applicable (§ 5 "Typed reports").
    fields:
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: mode
        type: ratchet.specification.GateMode
      - name: unenforced_since
        type: Optional<ratchet.specification.CalendarDate>
      - name: entry_state
        type: ratchet.gate.EntryState
      - name: not_applicable_reason
        type: Optional<String>
      - name: verdict
        type: Optional<ratchet.gate.Verdict>
        summary: Absent when the entry is not applicable.
      - name: cause
        type: Optional<ratchet.gate.VerdictCause>
      - name: next_step
        type: Optional<ratchet.gate.NextStep>
        summary: "`system` in place of `candidate` in an operational gate."
      - name: window
        type: Optional<ratchet.cli.WindowRow>
        summary: >-
          In an operational gate, the window this requirement was judged over, in place of a
          candidate (§ 5, § 6).
      - name: observed
        type: Optional<ratchet.cli.ValueRow>
      - name: meanings
        type: Optional<Map<String, String>>
        summary: >-
          The statements of the scope items of the requirement's measurement, by item name, as
          its `meanings` states them; each is shown beside the result of its item (§ 3 "Scope
          and aggregation").
      - name: meanings_without_result
        type: Optional<List<String>>
        summary: >-
          The items of `meanings` that no result of the run holds. A statement whose item the
          run lacks says nothing about the run, and the report names it.
      - name: allowed
        type: Optional<ratchet.cli.LimitRow>
        summary: The absolute limit.
      - name: reference
        type: Optional<ratchet.reference.ReferenceId>
      - name: reference_value
        type: Optional<ratchet.cli.ValueRow>
      - name: reference_stale
        type: Boolean
      - name: coverage
        type: Optional<ratchet.cli.CoverageRow>
      - name: conditions
        type: Optional<Map<String, String>>
      - name: evidence
        type: List<ratchet.evidence.RunId>
      - name: exceptions
        type: List<ratchet.specification.ExceptionId>
      - name: proof
        type: ratchet.gate.ProofStatus

  # design § 5 names active and expired exceptions; "expiring" is an active one inside
  # `--within-days`.
  - name: ratchet.cli.ExceptionStatus
    kind: enum
    variants: [active, expired]

  - name: ratchet.cli.ExceptionRow
    kind: struct
    fields:
      - name: exception
        type: ratchet.specification.ExceptionId
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: reason
        type: String
      - name: owner
        type: ratchet.specification.OwnerRef
      - name: expires
        type: ratchet.specification.CalendarDate
      - name: age_days
        type: Optional<Integer>
        summary: >-
          Counted from the entry's `created` date, or from the revision that added it (§ 5).
      - name: days_to_expiry
        type: Integer
        summary: Negative once expired.
      - name: status
        type: ratchet.cli.ExceptionStatus

  - name: ratchet.cli.GateReport
    kind: struct
    naming:
      summary: >-
        What `ratchet evaluate` prints: the verdict, a summary line that says when report-mode
        requirements fail, every entry with its mode (report-mode, not applicable, enforced),
        coverage, and the active and expired exceptions (§ 5). Fail precedes insufficient
        evidence in the gate's verdict. An operational gate's report has no candidate and
        gives each requirement's window.
    fields:
      - name: decision
        type: ratchet.gate.DecisionId
      - name: gate
        type: ratchet.specification.GateName
      - name: kind
        type: ratchet.specification.GateKind
      - name: candidate
        type: Optional<ratchet.specification.Revision>
        summary: Absent for an operational gate.
      - name: policy_revision
        type: ratchet.specification.Revision
      - name: verdict
        type: ratchet.gate.Verdict
      - name: summary
        type: String
      - name: requirements
        type: List<ratchet.cli.VerdictRow>
      - name: exceptions
        type: List<ratchet.cli.ExceptionRow>

  # reference propose and adopt ----------------------------------------------------------------
  - name: ratchet.cli.ProposeInput
    kind: struct
    naming:
      summary: >-
        The input of `ratchet reference propose` and `ratchet reference adopt`: adopt writes
        what propose with the same input prints (§ 5).
    fields:
      - name: requirement
        type: Optional<ratchet.specification.RequirementName>
        summary: >-
          One requirement; every requirement with a stale reference by default. A requirement
          named here that holds a `condition` and no `reference` is refused with
          `requirement_without_reference`: it has no reference to propose or adopt.
      - name: gains
        type: Optional<List<ratchet.specification.RequirementName>>
        summary: Present for a trade-off, the requirements whose gain it buys (§ 5).
      - name: trade_off
        type: Optional<ratchet.reference.TradeOffId>
        summary: The trade-off's id; required with `gains`.
      - name: reason
        type: Optional<String>
        summary: The trade-off's reason; required with `gains`.
      - name: owner
        type: Optional<ratchet.specification.OwnerRef>
        summary: The trade-off's owner reference; required with `gains`.

  - name: ratchet.cli.ProposalRow
    kind: struct
    fields:
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: kind
        type: ratchet.reference.ReferenceChangeKind
      - name: previous
        type: Optional<Json>
      - name: proposed
        type: Json
      - name: evidence
        type: List<ratchet.evidence.RunId>
      - name: needs_authorization
        type: Boolean
        summary: >-
          A loosening that is not part of a trade-off: it lands in a change of its own, merged
          before the candidate (D2, decided A by the owner on 2026-11-24).

  - name: ratchet.cli.TradeOffProposal
    kind: struct
    fields:
      - name: trade_off
        type: ratchet.reference.TradeOffId
      - name: reason
        type: String
      - name: owner
        type: ratchet.specification.OwnerRef
      - name: gains
        type: List<ratchet.reference.TradeOffEntry>
      - name: loosens
        type: List<ratchet.reference.TradeOffEntry>

  - name: ratchet.cli.ReferenceProposal
    kind: struct
    fields:
      - name: proposals
        type: List<ratchet.cli.ProposalRow>
      - name: trade_off
        type: Optional<ratchet.cli.TradeOffProposal>

  - name: ratchet.cli.WrittenFile
    kind: struct
    fields:
      - name: path
        type: String
        summary: Such as `ratchet/references/<requirement>.json` or `ratchet/trade-offs/<id>.json`.
      - name: requirement
        type: Optional<ratchet.specification.RequirementName>

  - name: ratchet.cli.AdoptResult
    kind: struct
    naming:
      summary: >-
        What `ratchet reference adopt` wrote into the working tree: the reference records and
        the trade-off record where there is one (§ 5). The reference change records follow when
        the change reaches the trusted revision.
    fields:
      - name: written
        type: List<ratchet.cli.WrittenFile>
      - name: references
        type: List<ratchet.reference.ReferenceId>
      - name: trade_off
        type: Optional<ratchet.reference.TradeOffId>

  # prove --------------------------------------------------------------------------------------
  - name: ratchet.cli.ProveInput
    kind: struct
    fields:
      - name: requirement
        type: Optional<ratchet.specification.RequirementName>
        summary: One requirement; every requirement that declares planted defects by default.

  - name: ratchet.cli.ProofRow
    kind: struct
    fields:
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: proof
        type: ratchet.evidence.ProofId
      - name: planted
        type: List<ratchet.specification.PlantedDefectId>
      - name: refused
        type: List<ratchet.specification.PlantedDefectId>
      - name: accepted
        type: List<ratchet.specification.PlantedDefectId>

  - name: ratchet.cli.ProofReport
    kind: struct
    fields:
      - name: proofs
        type: List<ratchet.cli.ProofRow>

  # render -------------------------------------------------------------------------------------
  - name: ratchet.cli.RenderInput
    kind: struct
    fields:
      - name: documents
        type: Optional<List<String>>
        summary: The documents holding marked blocks; every configured document by default.
      - name: export
        type: Optional<String>
        summary: >-
          The directory to write the static export of § 6 into: one page and one JSON data
          document over the records. A proposal: the design names no flag for it.
      - name: check
        type: Optional<Boolean>
        summary: >-
          Compare each block and the export with a fresh one and write nothing; a committed
          block or export is a generated reference (§ 5, § 6).

  - name: ratchet.cli.BlockRow
    kind: struct
    fields:
      - name: document
        type: String
      - name: block
        type: String
      - name: changed
        type: Boolean

  - name: ratchet.cli.ExportRow
    kind: struct
    fields:
      - name: page
        type: String
      - name: data
        type: String
        summary: The JSON data document; also the export a view across repositories reads (§ 6).
      - name: changed
        type: Boolean

  - name: ratchet.cli.RenderReport
    kind: struct
    fields:
      - name: blocks
        type: List<ratchet.cli.BlockRow>
      - name: export
        type: Optional<ratchet.cli.ExportRow>

  # status -------------------------------------------------------------------------------------
  - name: ratchet.cli.StatusInput
    kind: struct
    fields:
      - name: gate
        type: Optional<ratchet.specification.GateName>
        summary: Only the requirements this gate lists.

  - name: ratchet.cli.StatusRow
    kind: struct
    naming:
      summary: >-
        One requirement as `ratchet status` shows it (design § 5): verdict, value against limit
        or reference, when last checked, by which run, in which environment, and whether it is
        skipped locally.
    fields:
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: verdict
        type: Optional<ratchet.gate.Verdict>
        summary: The last verdict; absent when no run qualifies yet.
      - name: skipped_locally
        type: Boolean
        summary: >-
          `ratchet.toml` left its assessment out of runs on this machine. A state shown beside
          the last verdict, never as a pass (§ 5 "Two states are not verdicts").
      - name: observe_only
        type: Boolean
        summary: Listed in `[local] observe_only`; shown with its value and left out of the summary.
      - name: kind
        type: ratchet.specification.MeasurementKind
      - name: observed
        type: Optional<ratchet.cli.ValueRow>
      - name: limit
        type: Optional<ratchet.cli.LimitRow>
      - name: reference
        type: Optional<ratchet.cli.ValueRow>
      - name: last_checked
        type: Optional<String>
        summary: RFC 3339 time of the run that produced the verdict.
      - name: run
        type: Optional<ratchet.evidence.RunId>
      - name: environment
        type: Optional<ratchet.specification.TargetClass>
      - name: revision
        type: Optional<ratchet.specification.Revision>
      - name: proof
        type: ratchet.gate.ProofStatus
      - name: open_exception
        type: Optional<ratchet.specification.ExceptionId>

  - name: ratchet.cli.StatusReport
    kind: struct
    fields:
      - name: requirements
        type: List<ratchet.cli.StatusRow>

  # explain ------------------------------------------------------------------------------------
  - name: ratchet.cli.ExplainInput
    kind: struct
    fields:
      - name: requirement
        type: ratchet.specification.RequirementName

  - name: ratchet.cli.GateMembership
    kind: struct
    fields:
      - name: gate
        type: ratchet.specification.GateName
      - name: mode
        type: ratchet.specification.GateMode

  - name: ratchet.cli.StatementRow
    kind: struct
    fields:
      - name: statement
        type: ratchet.specification.StatementName
      - name: text
        type: String

  - name: ratchet.cli.Explanation
    kind: struct
    naming:
      summary: >-
        What `ratchet explain` prints: the requirement's `meaning`, the statements it serves,
        its audience, how it is measured, and where its evidence is (§ 5).
    fields:
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: meaning
        type: Optional<String>
      - name: statements
        type: List<ratchet.cli.StatementRow>
      - name: subject
        type: ratchet.specification.SubjectName
      - name: audiences
        type: List<ratchet.specification.AudienceName>
      - name: assessment
        type: ratchet.specification.AssessmentName
      - name: measurement
        type: ratchet.specification.MeasurementName
      - name: assessor
        type: ratchet.specification.AssessorRef
      - name: measurement_kind
        type: ratchet.specification.MeasurementKind
      - name: scope
        type: ratchet.specification.Scope
      - name: meanings
        type: Optional<Map<String, String>>
        summary: >-
          The statements of the scope items of the measurement, by item name, as its
          `meanings` states them (§ 3 "Scope and aggregation").
      - name: unit
        type: Optional<ratchet.specification.Unit>
      - name: condition
        type: Optional<ratchet.cli.LimitRow>
      - name: reference_kind
        type: Optional<ratchet.specification.ReferenceKind>
      - name: gates
        type: List<ratchet.cli.GateMembership>
      - name: evidence
        type: List<ratchet.evidence.RunId>
        summary: The most recent runs, where the evidence is.

  # history ------------------------------------------------------------------------------------
  - name: ratchet.cli.HistoryInput
    kind: struct
    fields:
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: limit
        type: Optional<Integer>
        summary: The most recent points to show.

  - name: ratchet.cli.HistoryPoint
    kind: struct
    fields:
      - name: run
        type: ratchet.evidence.RunId
      - name: at
        type: String
        summary: RFC 3339.
      - name: environment
        type: ratchet.specification.TargetClass
      - name: value
        type: Json
      - name: verdict
        type: Optional<ratchet.gate.Verdict>

  - name: ratchet.cli.ReferenceMark
    kind: struct
    fields:
      - name: change
        type: ratchet.reference.ReferenceChangeId
      - name: kind
        type: ratchet.reference.ReferenceChangeKind
      - name: adopted
        type: Json

  - name: ratchet.cli.History
    kind: struct
    fields:
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: points
        type: List<ratchet.cli.HistoryPoint>
      - name: reference_changes
        type: List<ratchet.cli.ReferenceMark>
      - name: exceptions
        type: List<ratchet.cli.ExceptionRow>

  # diff ---------------------------------------------------------------------------------------
  - name: ratchet.cli.DiffInput
    kind: struct
    fields:
      - name: requirement
        type: Optional<ratchet.specification.RequirementName>
      - name: candidate
        type: Optional<ratchet.specification.Revision>

  - name: ratchet.cli.DiffChange
    kind: enum
    variants: [new_item, lost_item, worse_value, better_value]

  - name: ratchet.cli.DiffRow
    kind: struct
    fields:
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: change
        type: ratchet.cli.DiffChange
      - name: item
        type: Optional<Json>
        summary: The identity-set item, for `new_item` and `lost_item`.
      - name: reference
        type: Optional<Json>
      - name: candidate
        type: Optional<Json>

  - name: ratchet.cli.DiffReport
    kind: struct
    fields:
      - name: items
        type: List<ratchet.cli.DiffRow>

  # doctor -------------------------------------------------------------------------------------
  # design § 5: the local config, the specifications, the tools, the local inputs and the record
  # store reachable. `local_inputs`: every key of `[inputs.<assessment>]` names a local input of
  # that plan's assessor (else `input_not_local`), its path is reachable, and a required local
  # input has a value on this machine (else the requirement is `not_assessable_here`).
  - name: ratchet.cli.DoctorCheckKind
    kind: enum
    variants: [config, specs, tools, local_inputs, record_store, sampled_conditions]

  - name: ratchet.cli.DoctorCheck
    kind: struct
    fields:
      - name: check
        type: ratchet.cli.DoctorCheckKind
      - name: ok
        type: Boolean
      - name: detail
        type: String

  - name: ratchet.cli.DoctorReport
    kind: struct
    fields:
      - name: checks
        type: List<ratchet.cli.DoctorCheck>

  # import -------------------------------------------------------------------------------------
  - name: ratchet.cli.ImportInput
    kind: struct
    fields:
      - name: source
        type: ratchet.evidence.ImportSourceKind
      - name: assessment
        type: ratchet.specification.AssessmentName
        summary: The assessment plan the imported runs belong to.
      - name: path
        type: Optional<String>
      - name: since
        type: Optional<String>
        summary: RFC 3339; import nothing older.

  - name: ratchet.cli.ImportResult
    kind: struct
    fields:
      - name: source
        type: ratchet.evidence.ImportSourceKind
      - name: runs
        type: List<ratchet.evidence.RunId>

  # exceptions ---------------------------------------------------------------------------------
  - name: ratchet.cli.ExceptionsInput
    kind: struct
    fields:
      - name: status
        type: Optional<ratchet.cli.ExceptionStatus>
      - name: within_days
        type: Optional<Integer>
        summary: Only exceptions that expire within this many days.
      - name: requirement
        type: Optional<ratchet.specification.RequirementName>

  - name: ratchet.cli.ExceptionList
    kind: struct
    fields:
      - name: exceptions
        type: List<ratchet.cli.ExceptionRow>

  # serve --------------------------------------------------------------------------------------
  - name: ratchet.cli.ServeInput
    kind: struct
    fields:
      - name: listen
        type: Optional<String>
        summary: The address to listen on; loopback by default.

  - name: ratchet.cli.ServeResult
    kind: struct
    fields:
      - name: url
        type: String
