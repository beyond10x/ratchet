domain: ratchet.evidence

summary: >-
  Observations: what one assessment run produced, with its resolved target, conditions,
  coverage and values per measurement (docs/design.md § 3, § 6), and the proof records
  `ratchet prove` writes (§ 4). Records are stored apart from gate decisions and reference
  changes, so old evidence can be re-evaluated against a new requirement (§ 6).

# Who writes a record: the `ratchet` commands of the CLI binding (`spec/cli.yaml`). They are
# local actions; this specification declares no ESS command that creates a record, so each
# record has one lifecycle state. A record gets its id from the CLI when it is written, as its
# type and a digest of its content, `run:<digest>` (§ 6). Records reach the series on
# `refs/ratchet/records` as described in `domains/config.yaml`.

types:
  - name: ratchet.evidence.RunId
    kind: newtype
    of: String
    naming:
      summary: >-
        The id of an assessment run record, `run:<digest of its content>`, citable from prose
        (§ 6).

  - name: ratchet.evidence.ProofId
    kind: newtype
    of: String
    naming:
      summary: The id of a proof record, its type and a digest of its content (§ 6).

  - name: ratchet.evidence.Window
    kind: struct
    naming:
      summary: >-
        The exact bounds of a time-window observation (§ 3). The window ends when the plan is
        assessed; for an operational gate, at the evaluation (§ 5).
    fields:
      - name: starts_at
        type: Timestamp
      - name: ends_at
        type: Timestamp

  - name: ratchet.evidence.WindowItems
    kind: struct
    naming:
      summary: >-
        What a time-window run read (§ 3, § 6): the number of population items, the time of
        the newest, and the number of runs left out. Fewer items than the plan's `min_samples`
        is insufficient evidence with the cause `too_few_samples`.
    fields:
      - name: items
        type: Integer
      - name: newest_item_at
        type: Optional<Timestamp>
        summary: Absent when the window holds no item.
      - name: runs_left_out
        type: Optional<Integer>
        summary: >-
          For a population over `runs_of`: the runs of the source plan in the window that did
          not qualify under it (outside its conditions or below its coverage). Absent for a
          population read outside the record store.

  - name: ratchet.evidence.ResolvedTarget
    kind: struct
    naming:
      summary: >-
        The target the evidence was collected from, recorded beside the expected target of the
        plan (§ 3): a commit and lockfile, an environment id with an artifact digest and a
        workload version, or a telemetry population with exact window bounds.
    fields:
      - name: kind
        type: ratchet.specification.TargetKind
      - name: class
        type: ratchet.specification.TargetClass
        summary: Where the evidence was produced; `ci` when a CI environment is detected (§ 5).
      - name: selection
        type: Optional<ratchet.specification.Selection>
      - name: revision
        type: Optional<ratchet.specification.Revision>
      - name: identifiers
        type: Map<String, String>
        summary: >-
          The identifiers § 3 lists per target kind, by name: `lockfile`, `environment_id`,
          `artifact_digest`, `workload_version`, `service`, `region`, `cohort`.
      - name: window
        type: Optional<ratchet.evidence.Window>

  - name: ratchet.evidence.HostLoad
    kind: struct
    naming:
      summary: >-
        The observed `host_load_per_cpu`: the 1-minute load average over the run divided by
        the number of CPUs, as mean, minimum and maximum (§ 3). The declared bound applies to
        the mean.
    fields:
      - name: mean
        type: Decimal
      - name: min
        type: Decimal
      - name: max
        type: Decimal

  - name: ratchet.evidence.ObservedConditions
    kind: struct
    naming:
      summary: >-
        The conditions the evidence was observed under (§ 3, § 6): runner, host load, tools and
        cache profile, and every further condition the plan or the assessor declares. A value
        the source does not hold, such as the host load of an imported run, is absent, which
        records it as unknown; evidence with an unknown value for a declared condition does not
        qualify for a gate and still extends a series (§ 6).
    fields:
      - name: runner
        type: Optional<String>
      - name: host_load_per_cpu
        type: Optional<ratchet.evidence.HostLoad>
      - name: tools
        type: Map<String, String>
        summary: The resolved version of each tool the plan's `tools` names (§ 3).
      - name: cache_profile
        type: Optional<String>
      - name: other
        type: Map<String, String>
        summary: Every further condition by name, such as the C library or the CPU model.

  - name: ratchet.evidence.EvidenceCoverage
    kind: struct
    naming:
      summary: >-
        How much of the plan a run executed: executed, skipped, not run and unsupported items,
        next to passed and failed (§ 1, § 3). One set of counts per run, whichever measurements
        read it; the items are of the assessor's coverage unit, which the evidence names.
    fields:
      - name: unit
        type: ratchet.assessor.CoverageUnit
        summary: The assessor's coverage unit, such as `walk` or `test` (§ 3, § 6).
      - name: executed
        type: Integer
      - name: skipped
        type: Integer
      - name: not_run
        type: Integer
      - name: unsupported
        type: Integer
      - name: passed
        type: Integer
      - name: failed
        type: Integer
      - name: executed_ids
        type: Optional<List<String>>
        summary: >-
          The ids of the executed items, ids of the coverage unit, where the plan declares
          `executed_ids`.

  - name: ratchet.evidence.IdentitySet
    kind: struct
    naming:
      summary: >-
        A set of items with stable identities, such as findings or passing cases, compared item
        by item (§ 1, § 4). Each item is keyed by the set's identity key.
    fields:
      - name: key
        type: List<String>
        summary: The identity key, such as `[rule, node_path, environment]`.
      - name: items
        type: List<Json>
        summary: >-
          The items, each an object with the key's members and the item fields the assessor
          declares. A member may be nested, as `environment: {viewport: narrow}` in § 3.

  - name: ratchet.evidence.NumberValue
    kind: struct
    fields:
      - name: value
        type: Decimal
      - name: unit
        type: Optional<ratchet.specification.Unit>
        summary: >-
          Present exactly when the assessor declares a unit for the output; a value without a
          unit has no `unit` key (§ 3).
      - name: at_least
        type: Boolean
        summary: >-
          The run reached the limit and was stopped there under qualifying conditions, so the
          value is "at least the limit" (§ 3).

  - name: ratchet.evidence.DigestValue
    kind: struct
    fields:
      - name: digest
        type: String
        summary: The digest of a generated file, compared with a fresh generation (§ 5).

  - name: ratchet.evidence.AssertionValue
    kind: struct
    naming:
      summary: >-
        An assertion holds or does not hold for each item of its scope (§ 3); a value is one
        item's result.
    fields:
      - name: holds
        type: Boolean

  # The value types of § 3 "Comparisons"; the tag is the value type.
  - name: ratchet.evidence.MeasuredValue
    kind: union
    tag: value_type
    variants:
      number: ratchet.evidence.NumberValue
      identity_set: ratchet.evidence.IdentitySet
      digest: ratchet.evidence.DigestValue
      assertion: ratchet.evidence.AssertionValue

  - name: ratchet.evidence.MeasurementResult
    kind: struct
    naming:
      summary: >-
        One result at the scope where it was observed, with its kind and value type (§ 6).
        Aggregation does not repeat a result outside its scope (§ 3 "Scope and aggregation").
    fields:
      - name: output
        type: ratchet.specification.OutputName
      - name: kind
        type: ratchet.specification.MeasurementKind
      - name: scope
        type: ratchet.specification.Scope
      - name: scope_item
        type: Optional<String>
        summary: The page, journey, test, scenario or variant the result belongs to.
      - name: boundary
        type: Optional<ratchet.specification.Boundary>
      - name: value
        type: ratchet.evidence.MeasuredValue

  # § 5 "Verdicts": a timed-out assessor and an assessor stopped by its infrastructure return
  # no result about the subject; § 3: a killed run is never recorded as such a result. § 5
  # "Local config" rule 2: a skipped assessment is recorded as a run that executed nothing.
  - name: ratchet.evidence.RunCompletion
    kind: enum
    variants: [completed, timed_out, stopped_by_infrastructure, skipped_locally]

  # The sources § 5 "Proposed CLI" names for `ratchet import`.
  - name: ratchet.evidence.ImportSourceKind
    kind: enum
    variants: [forge_runs, build_pool_log, junit]

  - name: ratchet.evidence.ImportSource
    kind: struct
    naming:
      summary: Where an imported run came from (§ 6).
    fields:
      - name: kind
        type: ratchet.evidence.ImportSourceKind
      - name: location
        type: String
        summary: The forge run, the job log or the JUnit file read.

entities:
  - name: ratchet.evidence.AssessmentRun
    naming:
      summary: >-
        The record of one run of an assessment plan (§ 6): candidate, resolved target and its
        class, assessor and protocol versions, timestamps or window bounds, values per
        measurement, sample or run count, coverage counts with their unit, observed conditions,
        queue wait and run time, the resolved value of each local input, artifact references,
        and for an imported run where it came from; for a window, the number of population
        items, the time of the newest and the number of runs left out. A run that
        `ratchet.toml` skipped locally is recorded as a run that executed nothing. An
        operational gate's evaluation writes the windows it assesses as runs (§ 5).
    identity:
      name: run
      type: ratchet.evidence.RunId
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: assessment
        type: ratchet.specification.AssessmentName
      - name: candidate
        type: Optional<ratchet.specification.Revision>
        summary: >-
          The candidate identity the evidence is attributable to (§ 3). Absent on a run of a
          time-window plan without `selection`, whose evidence is attributable to no candidate.
      - name: target
        type: ratchet.evidence.ResolvedTarget
      - name: assessor
        type: ratchet.specification.AssessorRef
      - name: protocol_version
        type: Optional<String>
        summary: >-
          The version of the assessment protocol; a change that affects comparability starts a
          new evidence series (§ 5).
      - name: started_at
        type: Optional<Timestamp>
      - name: ended_at
        type: Optional<Timestamp>
      - name: completion
        type: ratchet.evidence.RunCompletion
      - name: results
        type: Map<String, List<ratchet.evidence.MeasurementResult>>
        summary: >-
          The results per measurement, keyed by the plan's measurement name; one result per
          scope item.
      - name: samples
        type: Optional<Integer>
        summary: The sample or run count behind an aggregated value.
      - name: window_items
        type: Optional<ratchet.evidence.WindowItems>
        summary: >-
          On a time-window run: the population items it read; its bounds are
          `target.window`.
      - name: local_inputs
        type: Map<String, String>
        summary: >-
          The resolved value of each local input, by input name, as `[inputs.<assessment>]` of
          `ratchet.toml` supplied it on the machine that ran (§ 5 rule 6). A wrong path gives
          evidence from the wrong file, and only this record shows it (§ 9, D6). Empty when the
          assessor declares no local input.
      - name: coverage
        type: ratchet.evidence.EvidenceCoverage
      - name: conditions
        type: ratchet.evidence.ObservedConditions
      - name: queue_wait
        type: Optional<Duration>
      - name: run_time
        type: Optional<Duration>
      - name: artifacts
        type: List<String>
        summary: Pointers to the relevant logs, traces or findings (§ 5, § 6).
      - name: source
        type: Optional<ratchet.evidence.ImportSource>
        summary: Present on an imported run, which is an assessment run record (§ 6).
    invariants:
      - any: ["not defined(window_items)", "defined(target.window)"]
    relations:
      # references, not owns: a record outlives the document that governed it, so old evidence
      # can be re-evaluated against a new requirement (§ 6).
      - name: project
        kind: references
        target: ratchet.specification.QualitySpecification
        cardinality: one
        via: project
      - name: assessment
        kind: references
        target: ratchet.specification.AssessmentPlan
        cardinality: one
        via: assessment
      - name: assessor
        kind: references
        target: ratchet.assessor.Assessor
        cardinality: one
        via: assessor
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  - name: ratchet.evidence.ProofRecord
    naming:
      summary: >-
        What `ratchet prove` records (§ 4, § 6): the requirement, the revision, the planted
        defects run, and the ids refused and accepted. `ratchet prove` runs the assessment once
        per defect, never in the working tree, and expects the verdict fail; insufficient
        evidence is not a refusal. A gate report marks an enforced requirement with no proof
        record and no recorded fail as unproven.
    identity:
      name: proof
      type: ratchet.evidence.ProofId
    fields:
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: revision
        type: ratchet.specification.Revision
      - name: planted
        type: List<ratchet.specification.PlantedDefectId>
        summary: The planted defects run.
      - name: refused
        type: List<ratchet.specification.PlantedDefectId>
        summary: The defects whose run returned fail.
      - name: accepted
        type: List<ratchet.specification.PlantedDefectId>
        summary: >-
          The defects the check did not refuse. A defect in neither list returned insufficient
          evidence: a reading of "insufficient evidence is not a refusal" (§ 4).
      - name: recorded_at
        type: Timestamp
    relations:
      - name: requirement
        kind: references
        target: ratchet.specification.QualityRequirement
        cardinality: one
        via: requirement
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
