domain: ratchet.gate

summary: >-
  Gate decisions: the verdict a gate returned under the policy of a trusted revision, for a
  candidate or, in an operational gate, over the windows of its time-window plans, and the
  result of each entry it listed (docs/design.md § 5, § 6).

types:
  - name: ratchet.gate.DecisionId
    kind: newtype
    of: String
    naming:
      summary: The id of a gate decision record, its type and a digest of its content (§ 6).

  - name: ratchet.gate.VerdictId
    kind: newtype
    of: String
    naming:
      summary: >-
        The id of one entry's result within a decision; the proposal is
        `<decision>/<requirement>`, unique because a gate lists a requirement once.

  # § 5 "Verdicts": only a pass clears the gate.
  - name: ratchet.gate.Verdict
    kind: enum
    variants: [pass, fail, insufficient_evidence]

  # § 5 "Verdicts": the causes are a closed list in two parts. `FailCause` holds the causes of a
  # fail (next step on the candidate, or on the system in an operational gate).
  # `InsufficientEvidenceCause` holds the causes of insufficient evidence (next step on the
  # assessment); an assessment run names one of them on an incomplete result
  # (`ratchet.evidence.Incomplete`). `VerdictCause` is the two lists together, in that order,
  # for a row that holds either; an invariant of `RequirementVerdict` ties its cause to the
  # list of its verdict.
  - name: ratchet.gate.FailCause
    kind: enum
    variants:
      - limit_crossed
      - regression
      - new_items
      - lost_items
      - assertion_not_held
      - generated_reference_differs
      - stale_reference_not_adopted

  # `too_few_samples` covers a window with fewer items than `min_samples` (§ 3),
  # and a scope item whose result carries fewer samples than `min_samples_per_item` (§ 5).
  # `incompatible_target` also covers a run whose assessor refused its inputs
  # (docs/evidence-format.md E9). `reference_missing` also covers a scope item the evidence
  # holds and the reference does not, and `coverage_below_plan` a scope item the reference holds
  # and the evidence does not (§ 5 "Verdicts"). `evidence_missing`: the requirement has no
  # qualifying run for the candidate, or in an operational gate for the window; a name this
  # specification adds, because § 5 named no cause for it.
  - name: ratchet.gate.InsufficientEvidenceCause
    kind: enum
    variants:
      - too_few_samples
      - assessor_timed_out
      - assessor_infrastructure_failure
      - stale_telemetry
      - incompatible_target
      - conditions_outside_declared
      - coverage_below_plan
      - tool_mismatch
      - reference_missing
      - reference_not_comparable
      - not_attributable_to_candidate
      - not_assessable_here
      - skipped_locally
      - evidence_missing

  - name: ratchet.gate.VerdictCause
    kind: enum
    variants:
      - limit_crossed
      - regression
      - new_items
      - lost_items
      - assertion_not_held
      - generated_reference_differs
      - stale_reference_not_adopted
      - too_few_samples
      - assessor_timed_out
      - assessor_infrastructure_failure
      - stale_telemetry
      - incompatible_target
      - conditions_outside_declared
      - coverage_below_plan
      - tool_mismatch
      - reference_missing
      - reference_not_comparable
      - not_attributable_to_candidate
      - not_assessable_here
      - skipped_locally
      - evidence_missing

  # § 5: a non-pass "says whether the next step is on the candidate or on the assessment". An
  # operational gate has no candidate: the next step of a fail there is on the host or the
  # population the gate judges, `system`, in place of `candidate` (§ 3 value lists, § 5). Which
  # of the two a fail takes depends on the kind of the gate on the decision, which an invariant
  # of `RequirementVerdict` cannot read; the rule is the CLI's (spec/README.md).
  - name: ratchet.gate.NextStep
    kind: enum
    variants: [candidate, assessment, system]

  # § 4: an enforced requirement with no proof record and no recorded fail is unproven.
  - name: ratchet.gate.ProofStatus
    kind: enum
    variants: [proven, unproven]

  # § 5 "Two states are not verdicts": an entry whose `when` does not match the change is not
  # applicable; it is not evaluated and does not block.
  - name: ratchet.gate.EntryState
    kind: enum
    variants: [evaluated, not_applicable]

  - name: ratchet.gate.AppliedException
    kind: struct
    naming:
      summary: >-
        An exception a decision applied, copied with its reason, owner reference and expiry:
        an exception is an entry of the specification and not a record (§ 6).
    fields:
      - name: exception
        type: ratchet.specification.ExceptionId
      - name: reason
        type: String
      - name: owner
        type: ratchet.specification.OwnerRef
      - name: expires
        type: ratchet.specification.CalendarDate

entities:
  - name: ratchet.gate.GateDecision
    naming:
      summary: >-
        The record of one gate evaluation (§ 6): candidate, gate, the revision of the policy,
        evidence ids and the verdict of the gate, with each entry's result. The gate passes
        when every enforced entry that applies has passed, fails when at least one of them
        fails, and otherwise returns insufficient evidence: fail comes first, because a fail is
        a result about the candidate (§ 5). An operational gate's verdict decides nothing about
        a candidate: it has none, and records the window bounds of each requirement in its
        place (§ 6).
    identity:
      name: decision
      type: ratchet.gate.DecisionId
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: gate
        type: ratchet.specification.GateName
      - name: kind
        type: ratchet.specification.GateKind
      - name: candidate
        type: Optional<ratchet.specification.Revision>
        summary: >-
          Present for a candidate gate, absent for an operational gate, whose
          `ratchet evaluate` takes no candidate (§ 5 "Gate kinds").
      - name: policy_revision
        type: ratchet.specification.Revision
        summary: >-
          The trusted revision whose policy and references judged the candidate, or for an
          operational gate the windows (§ 5).
      - name: verdict
        type: ratchet.gate.Verdict
      - name: reason
        type: String
        summary: >-
          The summary line; it says when report-mode entries fail (§ 5 "Gate modes").
      - name: decided_at
        type: Timestamp
    invariants:
      - any: ["kind == operational", "defined(candidate)"]
      - any: ["kind == candidate", "not defined(candidate)"]
    relations:
      - name: project
        kind: references
        target: ratchet.specification.QualitySpecification
        cardinality: one
        via: project
      - name: gate
        kind: references
        target: ratchet.specification.Gate
        cardinality: one
        via: gate
      - name: verdicts
        kind: owns
        target: ratchet.gate.RequirementVerdict
        cardinality: many
        via: decision
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  - name: ratchet.gate.RequirementVerdict
    naming:
      summary: >-
        One entry's result within a gate decision (§ 5, § 6): requirement, mode, the protected
        reference or absolute limit, verdict, observed and allowed values, coverage counts,
        observed conditions, pointers to the evidence, the exceptions applied, whether it is
        proven, and for a non-pass its cause and whether the next step is on the candidate, on
        the assessment, or in an operational gate on the system. An entry that is not applicable
        has no verdict and names the reason. In an operational gate the row records the bounds
        of the window it was judged over.
    identity:
      name: verdict_id
      type: ratchet.gate.VerdictId
    fields:
      - name: decision
        type: ratchet.gate.DecisionId
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: mode
        type: ratchet.specification.GateMode
      - name: unenforced_since
        type: Optional<ratchet.specification.CalendarDate>
        summary: For report mode, the date since which it has not been enforced (§ 5).
      - name: entry_state
        type: ratchet.gate.EntryState
      - name: not_applicable_reason
        type: Optional<String>
        summary: Present when the entry is not applicable, such as the `when` paths not touched.
      - name: verdict
        type: Optional<ratchet.gate.Verdict>
        summary: Absent when the entry is not applicable.
      - name: cause
        type: Optional<ratchet.gate.VerdictCause>
        summary: Present for every verdict that is not a pass.
      - name: next_step
        type: Optional<ratchet.gate.NextStep>
        summary: >-
          Present for every verdict that is not a pass: `candidate` or `assessment`, and
          `system` in place of `candidate` in an operational gate.
      - name: window
        type: Optional<ratchet.evidence.Window>
        summary: >-
          In an operational gate, the bounds of the window this requirement was judged over,
          in place of a candidate (§ 5, § 6). Absent in a candidate gate.
      - name: observed
        type: List<ratchet.evidence.MeasurementResult>
      - name: allowed
        type: Optional<ratchet.specification.Condition>
        summary: The absolute limit the observed value was compared with.
      - name: reference
        type: Optional<ratchet.reference.ReferenceId>
        summary: The protected reference the observed value was compared with.
      - name: reference_stale
        type: Boolean
        summary: >-
          The candidate's evidence is better than the reference by more than the tolerance
          (§ 5 rule 4).
      - name: coverage
        type: Optional<ratchet.evidence.EvidenceCoverage>
      - name: conditions
        type: Optional<ratchet.evidence.ObservedConditions>
      - name: evidence
        type: List<ratchet.evidence.RunId>
      - name: exceptions
        type: List<ratchet.gate.AppliedException>
        summary: The exceptions applied; an expired one no longer applies (§ 5).
      - name: proof
        type: ratchet.gate.ProofStatus
    invariants:
      - any: ["entry_state == evaluated", "not defined(verdict)"]
      # Every verdict that is not a pass has a cause. A fail names a cause of `FailCause`,
      # insufficient evidence one of `InsufficientEvidenceCause`.
      - any: ["not defined(verdict)", "verdict == pass", "defined(cause)"]
      - any:
          - "verdict != fail"
          - cause:
              - limit_crossed
              - regression
              - new_items
              - lost_items
              - assertion_not_held
              - generated_reference_differs
              - stale_reference_not_adopted
      - any:
          - "verdict != insufficient_evidence"
          - cause:
              - too_few_samples
              - assessor_timed_out
              - assessor_infrastructure_failure
              - stale_telemetry
              - incompatible_target
              - conditions_outside_declared
              - coverage_below_plan
              - tool_mismatch
              - reference_missing
              - reference_not_comparable
              - not_attributable_to_candidate
              - not_assessable_here
              - skipped_locally
              - evidence_missing
    relations:
      - name: requirement
        kind: references
        target: ratchet.specification.QualityRequirement
        cardinality: one
        via: requirement
      - name: reference
        kind: references
        target: ratchet.reference.ProtectedReference
        cardinality: one
        via: reference
      - name: evidence
        kind: references
        target: ratchet.evidence.AssessmentRun
        cardinality: many
        via: evidence
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
