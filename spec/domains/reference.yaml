domain: ratchet.reference

summary: >-
  Protected references and how they change: the accepted state regressions are compared with,
  the record of each change to one, and trade-offs (docs/design.md § 1, § 5, § 6).

# Place (D1 of docs/design.md § 9, decided A by the owner on 2026-11-24): reference records and
# trade-off records are files in the tree, one per requirement at
# `ratchet/references/<requirement>.json` and one per trade-off at `ratchet/trade-offs/<id>.json`.
# The gate reads the copy at the trusted revision (§ 5 rule 1). `ratchet reference propose`
# writes nothing; `ratchet reference adopt` writes these files into the working tree. A
# reference change becomes a record when its change reaches the trusted revision; the job that
# appends records to `refs/ratchet/records` writes it (§ 6).
#
# Authorization (D2, decided A by the owner on 2026-11-24): a loosening never applies to the
# candidate that carries it. It lands in a change of its own, merged before the candidate; the
# forge's review of that change is the authorization. A regeneration, a tightening and a
# trade-off whose gains the CLI checks need no separate authorization.

types:
  - name: ratchet.reference.ReferenceId
    kind: newtype
    of: String
    naming:
      summary: >-
        The id of a reference record as adopted, its type and a digest of its content (§ 6). The
        file `ratchet/references/<requirement>.json` holds the requirement's current one.

  - name: ratchet.reference.ReferenceChangeId
    kind: newtype
    of: String
    naming:
      summary: The id of a reference change record, its type and a digest of its content (§ 6).

  - name: ratchet.reference.TradeOffId
    kind: newtype
    of: String
    naming:
      summary: >-
        The `id` of a trade-off record, such as `in-page-navigation`; the file is
        `ratchet/trade-offs/<id>.json`.

  # § 6 "Reference change": first adoption, regeneration, tightening, loosening, trade-off.
  - name: ratchet.reference.ReferenceChangeKind
    kind: enum
    variants: [first_adoption, regeneration, tightening, loosening, trade_off]

  - name: ratchet.reference.ReferenceValue
    kind: struct
    naming:
      summary: >-
        One accepted value per scope item, as the § 3 record shows:
        `{scope, item, value, unit}`. The value is text, so no decimal changes in a conversion;
        for a generated reference it is the digest.
    fields:
      - name: scope
        type: ratchet.specification.Scope
      - name: item
        type: Optional<String>
        summary: The scope item, such as `ess-ui:partner-portal/search-by-name`.
      - name: value
        type: String
      - name: unit
        type: Optional<ratchet.specification.Unit>

  - name: ratchet.reference.AcceptedItem
    kind: struct
    naming:
      summary: >-
        One item of an accepted identity set, keyed by the set's identity key. It can carry a
        `reason` and an `owner`: an allowlist entry for a permanent false positive is such an
        item. Adding an item is a loosening (§ 5).
    fields:
      - name: item
        type: Json
      - name: reason
        type: Optional<String>
      - name: owner
        type: Optional<ratchet.specification.OwnerRef>

  - name: ratchet.reference.LastChange
    kind: struct
    naming:
      summary: >-
        The context of a reference's last change, as the § 3 record shows:
        `{kind, authorized_by}`, and the trade-off it belongs to where there is one.
    fields:
      - name: kind
        type: ratchet.reference.ReferenceChangeKind
      - name: authorized_by
        type: Optional<ratchet.specification.DecisionRef>
      - name: trade_off
        type: Optional<ratchet.reference.TradeOffId>

  - name: ratchet.reference.TradeOffEntry
    kind: struct
    naming:
      summary: >-
        One value of a trade-off, `{requirement, item, from, to}`: a requirement and, where it
        has a value per scope item, the item, with the old and the new value as text (§ 5).
    fields:
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: item
        type: Optional<String>
      - name: from
        type: String
      - name: to
        type: String

entities:
  - name: ratchet.reference.ProtectedReference
    naming:
      summary: >-
        A reference record (§ 5 "Reference records", format `ratchet-reference/1`): the
        requirement, the kind, the revision it was adopted at, the values per scope item or the
        items of a set, the conditions, the evidence ids and the context of its last change.
        A generated reference names its committed files and is compared by bytes or digest with
        tolerance 0; an accepted value is compared with a tolerance per key. A reference is
        current or superseded by computation and not by a stored state: it is superseded when
        a later reference change names it as the previous one, and no command moves it. Hence
        one lifecycle state.
    identity:
      name: reference
      type: ratchet.reference.ReferenceId
    fields:
      - name: format
        type: String
        summary: "`ratchet-reference/1`."
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: kind
        type: ratchet.specification.ReferenceKind
      - name: revision
        type: ratchet.specification.Revision
        summary: The commit the value was adopted at.
      - name: paths
        type: Optional<List<String>>
        summary: For a generated reference, the committed files.
      - name: values
        type: Optional<List<ratchet.reference.ReferenceValue>>
        summary: The accepted values per scope item; absent for an identity set.
      - name: items
        type: Optional<List<ratchet.reference.AcceptedItem>>
        summary: The accepted set, in place of `values`, for an identity set.
      - name: conditions
        type: ratchet.evidence.ObservedConditions
        summary: The tools, image, runner and host class that produced it (§ 5 rule 5).
      - name: evidence
        type: List<ratchet.evidence.RunId>
        summary: >-
          The runs supporting its adoption, produced before the candidate (§ 5 rule 3), such as
          the last 10 qualifying runs on the trusted revision.
      - name: last_change
        type: ratchet.reference.LastChange
    relations:
      - name: requirement
        kind: references
        target: ratchet.specification.QualityRequirement
        cardinality: one
        via: requirement
      - name: evidence
        kind: references
        target: ratchet.evidence.AssessmentRun
        cardinality: many
        via: evidence
    lifecycle:
      initial: Adopted
      states: [Adopted]
      terminal: [Adopted]

  - name: ratchet.reference.ReferenceChange
    naming:
      summary: >-
        The record of one change to a protected reference (§ 6): one requirement, the kind of
        change, previous and adopted references, the conditions of the adopted one (on that
        reference), supporting evidence, the trade-off it belongs to, and the revision or
        decision that authorized adoption. Regenerations and tightenings are recorded too
        (§ 5). A proposal is not a stored record.
    identity:
      name: change
      type: ratchet.reference.ReferenceChangeId
    fields:
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: kind
        type: ratchet.reference.ReferenceChangeKind
      - name: previous
        type: Optional<ratchet.reference.ReferenceId>
        summary: Absent on a first adoption.
      - name: adopted
        type: ratchet.reference.ReferenceId
      - name: evidence
        type: List<ratchet.evidence.RunId>
        summary: The supporting evidence (§ 6).
      - name: trade_off
        type: Optional<ratchet.reference.TradeOffId>
        summary: The trade-off this change belongs to; one change per requirement it loosens.
      - name: authorized_by
        type: Optional<ratchet.specification.DecisionRef>
        summary: >-
          The revision or decision that authorized adoption: for a loosening, the merge of its
          own change (D2). Absent for a regeneration or a tightening, which the gate verifies.
    relations:
      - name: requirement
        kind: references
        target: ratchet.specification.QualityRequirement
        cardinality: one
        via: requirement
      - name: adopted
        kind: references
        target: ratchet.reference.ProtectedReference
        cardinality: one
        via: adopted
      - name: previous
        kind: references
        target: ratchet.reference.ProtectedReference
        cardinality: one
        via: previous
      - name: evidence
        kind: references
        target: ratchet.evidence.AssessmentRun
        cardinality: many
        via: evidence
      - name: trade_off
        kind: references
        target: ratchet.reference.TradeOff
        cardinality: one
        via: trade_off
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  - name: ratchet.reference.TradeOff
    naming:
      summary: >-
        A record that accepts worse values for some requirements and names the better values
        it buys (§ 1, § 5, format `ratchet-trade-off/1`). `ratchet reference propose` with
        gains named drafts it from the candidate's evidence and `ratchet reference adopt`
        writes it; the CLI checks that the named gains are present and nothing outside
        `loosens` got worse. The loosened values become the references, so it has no expiry.
    identity:
      name: trade_off
      type: ratchet.reference.TradeOffId
    fields:
      - name: format
        type: String
        summary: "`ratchet-trade-off/1`."
      - name: project
        type: ratchet.specification.ProjectName
      - name: reason
        type: String
      - name: owner
        type: ratchet.specification.OwnerRef
      - name: gains
        type: List<ratchet.reference.TradeOffEntry>
      - name: loosens
        type: List<ratchet.reference.TradeOffEntry>
        # The requirement of an entry sits inside a struct element, which a relation's `via:`
        # cannot name, so these links have no relation entry; `ratchet validate` resolves them.
      - name: authorized_by
        type: Optional<ratchet.specification.DecisionRef>
        summary: The decision that authorized it (§ 6).
    relations:
      - name: project
        kind: references
        target: ratchet.specification.QualitySpecification
        cardinality: one
        via: project
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
