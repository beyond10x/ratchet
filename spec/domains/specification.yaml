domain: ratchet.specification

summary: >-
  What a project declares in its ratchet/1 document: statements, subjects, audiences, assessment
  plans with their measurements, requirements, gates, exceptions and preset bindings, and what a
  preset in the catalog declares (docs/design.md § 1, § 3, § 4, § 5). Every entity here is
  authored in a document and read from the trusted revision; no Ratchet command creates one.

# Sources: docs/design.md revision 4, § 1 (domain language), § 3 (time windows, comparisons,
# illustrative project YAML, value lists), § 4 (custom assessors, local inputs, presets, planted
# defects), § 5 (gates, gate kinds, exceptions), § 9 (D1 to D4 decided A; D5 and D6 open, written
# under default A). Field names follow that YAML and are proposals (AGENTS.md § Phase: design).
# An authored entry has the id its author gave it: the key of its map (§ 6).

types:
  - name: ratchet.specification.ProjectName
    kind: newtype
    of: String
    naming:
      summary: The `project:` key of a ratchet/1 document, such as `partner-portal`.

  - name: ratchet.specification.Revision
    kind: newtype
    of: String
    naming:
      summary: A repository revision, such as a commit id or the trusted copy on `main`.

  - name: ratchet.specification.CalendarDate
    kind: newtype
    of: String
    naming:
      summary: >-
        An ISO 8601 calendar date, `2026-12-15`, as `expires:`, `created:` and `since:` spell it.
        It is the text of the scalar, quoted or plain: a `ratchet/1` file is read by the YAML 1.2
        core schema, which has no date type (docs/design.md § 12).

  - name: ratchet.specification.StatementName
    kind: newtype
    of: String
    naming:
      summary: The key of a quality statement under `statements:`, such as `search-is-fast`.

  - name: ratchet.specification.SubjectName
    kind: newtype
    of: String
    naming:
      summary: The key of a subject under `subjects:`.

  - name: ratchet.specification.SubjectKind
    kind: newtype
    of: String
    naming:
      summary: >-
        What sort of thing a subject is, such as `user-interaction` or `codebase`. A free label
        of the author (§ 3 value lists).

  - name: ratchet.specification.AudienceName
    kind: newtype
    of: String
    naming:
      summary: >-
        Who experiences a subject's quality, such as `portal-user` or `coding-agent`. A free
        label of the author (§ 3 value lists); the design gives an audience no attribute of its
        own, so it is not an entity.

  - name: ratchet.specification.AssessmentName
    kind: newtype
    of: String
    naming:
      summary: The key of an assessment plan under `assessments:`.

  - name: ratchet.specification.MeasurementName
    kind: newtype
    of: String
    naming:
      summary: >-
        The key of a measurement in a plan's `measurements` map, such as `p95` or `step-time`
        (§ 3 "Several measurements from one run").

  - name: ratchet.specification.AssessorRef
    kind: newtype
    of: String
    naming:
      summary: An assessor and its pinned version, `browser-request-timing@1`.

  - name: ratchet.specification.OutputName
    kind: newtype
    of: String
    naming:
      summary: >-
        An output an assessor declares and a measurement reads, such as `findings` or
        `duration` (§ 3 value lists: the assessor declares it).

  - name: ratchet.specification.Unit
    kind: newtype
    of: String
    naming:
      summary: >-
        The unit of a value: `ms`, `s`, `steps`, bytes, money per run or per day, model calls
        per run (§ 3). The assessor declares it per output, or declares that the output has
        none; `ratchet/1` converts no units. A number has a unit exactly when its output
        declares one: an output without a unit (a layout shift, a ratio, the number of items of
        a set) takes no `unit` on the measurement, the `condition` or a record.

  # § 3 value lists: Ratchet, closed. Exact gives the same value for the same input under the
  # same conditions; sampled varies between runs.
  - name: ratchet.specification.MeasurementKind
    kind: enum
    variants: [exact, sampled]

  # § 3 "Comparisons" and value lists: Ratchet, closed.
  - name: ratchet.specification.ValueType
    kind: enum
    variants: [number, identity_set, digest, assertion]

  - name: ratchet.specification.Scope
    kind: newtype
    of: String
    naming:
      summary: >-
        The unit one result belongs to: a state, a journey, a page, a test, a file, a variant,
        a run (§ 1, § 3). Not a closed list: an assessor declares the scopes of its outputs and
        `ratchet validate` checks a measurement's scope against that declaration. `run`, the
        whole run, is Ratchet's and every assessor has it.

  - name: ratchet.specification.Boundary
    kind: newtype
    of: String
    naming:
      summary: >-
        Which part of a duration a measurement is about (§ 3): `run_time` and `queue_wait` are
        Ratchet's; an assessor declares others, such as
        `request_start_to_response_complete`.

  # § 3 value lists: Ratchet, closed.
  - name: ratchet.specification.AggregationKind
    kind: enum
    variants: [sum, median, percentile, best_of_n, pass_rate]

  - name: ratchet.specification.Aggregation
    kind: struct
    naming:
      summary: >-
        An aggregation as a map, `{kind: percentile, parameter: 95}` or `{kind: median}` (§ 3
        value lists). Declared where a sampled plan has more than one run or sample. A sampled
        measurement of a plan with `runs` above 1 states an aggregation or
        `Measurement.over_all_runs`, a value its assessor computes over all runs of the plan,
        such as the share of tests that passed in one run and failed in another; one that
        states neither is an error (§ 3 "One run per candidate is valid").
    fields:
      - name: kind
        type: ratchet.specification.AggregationKind
      - name: parameter
        type: Optional<Integer>
        summary: The rank of a percentile (95) or the N of best of N.

  # § 3 value lists: `better`, Ratchet, closed.
  - name: ratchet.specification.Direction
    kind: enum
    variants: [lower, higher]

  - name: ratchet.specification.Measurement
    kind: struct
    naming:
      summary: >-
        The value or assertion being evaluated, with a kind, unit, scope and aggregation where
        applicable, and the direction that is better (§ 1). One entry of a plan's
        `measurements` map; every measurement of a plan reads the plan's one run (§ 3). A
        measurement of a time-window plan over `runs_of` reads a measurement of the source plan
        by name as its `output`, keeps its scope, unit and direction, and declares an
        `aggregation` across the runs in the window (§ 3 "A series of runs as a population").
    fields:
      - name: kind
        type: ratchet.specification.MeasurementKind
      - name: output
        type: ratchet.specification.OutputName
      - name: scope
        type: ratchet.specification.Scope
      - name: unit
        type: Optional<ratchet.specification.Unit>
        summary: >-
          Present exactly when the assessor declares a unit for the output, and then that unit
          (§ 3 "Comparisons"). `ratchet validate` refuses a missing one (`unit_missing`), another
          one (`unit_mismatch`) and one on an output without a unit (`unit_not_declared`). The
          rule reads the assessor's declaration, so ESS does not check it here. An output has
          one unit, the one its assessor declares, and every value of it is written in that
          unit: 45 minutes of an output in `s` is `2700`. Two assessors may declare two units
          for the same kind of value, such as `min` and `s` for a duration; `ratchet/1`
          converts neither.
      - name: aggregation
        type: Optional<ratchet.specification.Aggregation>
        summary: >-
          Absent with `runs: 1` where the command measures once: the value is judged as
          observed (§ 3 "One run per candidate is valid"). With `runs: 1` one of the existing
          aggregation kinds is valid where the command repeats its measurement itself within
          the one run, such as the median of three timings it prints or a value per segment
          of its output: the repeats are samples of that run (evidence format § 1). On a
          time-window plan, the aggregation across the runs in the window: one
          value at the scope `run`, one value per item at any other scope; a window aggregates
          numbers, and assertions with `pass_rate`. Absent where the measurement states
          `over_all_runs`.
      - name: over_all_runs
        type: Optional<Boolean>
        summary: >-
          `true`: the assessor computes one value over all runs of the plan, which is no
          aggregation of a value per run, such as the share of tests that passed in one run and
          failed in another (§ 3 "One run per candidate is valid"). A sampled measurement of a
          plan with `runs` above 1 states it or an `aggregation`. It is valid for every value of
          `runs` and is no aggregation, so a measurement that states it declares no
          `aggregation`, also at `runs: 1`. The result carries the number of runs in `samples`
          and no `aggregation` (format § 3). Absent means `false`.
      - name: boundary
        type: Optional<ratchet.specification.Boundary>
      - name: better
        type: Optional<ratchet.specification.Direction>
        summary: >-
          Which way is worse for an accepted value. `ratchet validate` reports a number with a
          reference and no `better` (§ 3).
      - name: identity
        type: Optional<List<String>>
        summary: >-
          The identity key when the measurement is an identity set, such as
          `[rule, node_path, environment]` (§ 1, § 4).
      - name: filter
        type: Optional<Map<String, List<String>>>
        summary: >-
          On an identity set, keeps the items whose field has one of the listed values, such as
          `{severity: [serious, critical]}`, before the comparison. The fields are those the
          assessor declares for the items; a changed filter starts a new evidence series (§ 3).

  # § 3 value lists: Ratchet, closed.
  - name: ratchet.specification.ObservationKind
    kind: enum
    variants: [snapshot, controlled_run, time_window]

  # § 3 value lists: Ratchet, closed. `document` is one file identified by the digest of its
  # bytes, committed or not: a design variant, an `ess-ui/1` document, a report
  # (docs/evidence-format.md E1, decided A).
  - name: ratchet.specification.TargetKind
    kind: enum
    variants: [revision, build, deployment, workflow_run, telemetry_population, document]

  # § 3 value lists: `environments`, Ratchet, closed.
  - name: ratchet.specification.TargetClass
    kind: enum
    variants: [local, ci, ephemeral, staging, production]

  # § 3 value lists: Ratchet, closed. `merge_result` is the candidate merged into the trusted
  # revision (§ 3, § 5 generated references).
  - name: ratchet.specification.Selection
    kind: enum
    variants: [candidate, merge_result]
    naming:
      summary: >-
        Which tree or build is assessed: `candidate`, or `merge_result`, the candidate merged
        into the trusted revision (§ 3). Under `merge_result` the record names the two apart:
        `candidate` is the revision under judgement, such as the head of a pull request, and
        `target.revision` the merged tree that was read (format § 3).

  - name: ratchet.specification.TargetSpec
    kind: struct
    naming:
      summary: >-
        The expected target an assessment plan names (§ 3). The evidence records the resolved
        target beside it.
    fields:
      - name: kind
        type: ratchet.specification.TargetKind
      - name: environments
        type: List<ratchet.specification.TargetClass>
        summary: The target classes the plan runs in; always a list (§ 3).
      - name: selection
        type: Optional<ratchet.specification.Selection>
        summary: >-
          Which tree or build is assessed (§ 3). A time-window plan declares one only when its
          population is the candidate's alone, such as a cohort only the candidate serves;
          without one its evidence is attributable to no candidate and the plan serves an
          operational gate. A window over `runs_of` has none.
        # UNMAPPED: revision 4 answers the absent `selection` of a time-window plan (attributable
        # to no candidate). For a snapshot or controlled-run plan the § 3 YAML still leaves it out
        # (`search-ui`, `test-step`) and the design states no default. Read here as `candidate`
        # when absent; open question for the owner.

  # The bare spellings of design § 3 and § 5 (`skipped: 0`, `adoption: same_change`) are not
  # declared in 0.1.0: the Rust target of `ess generate synthesize` refuses a struct that
  # declares a `shorthand:`. `MinimumBound`, `MaximumBound` and `RatchetPolicy` are therefore
  # written in the long form. A shorthand added later admits every document written in the long
  # form.
  - name: ratchet.specification.MinimumBound
    kind: struct
    naming:
      summary: >-
        The coverage bound on `executed`, `{min: 3}`: `min` is required and `{min, max}` states
        both (§ 3 "Evidence coverage").
    fields:
      - name: min
        type: Integer
      - name: max
        type: Optional<Integer>

  - name: ratchet.specification.MaximumBound
    kind: struct
    naming:
      summary: >-
        The coverage bound on `skipped`, `not_run` and `unsupported`, `{max: 0}`: `max` is
        required and `{min, max}` states both (§ 3 "Evidence coverage").
    fields:
      - name: max
        type: Integer
      - name: min
        type: Optional<Integer>

  - name: ratchet.specification.ExecutedIds
    kind: struct
    naming:
      summary: >-
        The exact set of executed item ids that qualifies, as `{ids: [...]}` or as
        `{file: <path>}` read from the trusted revision (§ 3). The list takes the key `ids` and
        is never written bare: an ESS shorthand stands only for a scalar.
    fields:
      - name: ids
        type: Optional<List<String>>
      - name: file
        type: Optional<String>

  - name: ratchet.specification.CoverageBounds
    kind: struct
    naming:
      summary: >-
        The coverage that qualifies, as bounds on the counts or as an exact set of executed item
        ids (§ 3 "Evidence coverage"). A run below it is insufficient evidence with the cause
        `coverage_below_plan`. A plan whose `scenarios` hold a pattern declares it.
    fields:
      - name: executed
        type: Optional<ratchet.specification.MinimumBound>
      - name: skipped
        type: Optional<ratchet.specification.MaximumBound>
      - name: not_run
        type: Optional<ratchet.specification.MaximumBound>
      - name: unsupported
        type: Optional<ratchet.specification.MaximumBound>
      - name: executed_ids
        type: Optional<ratchet.specification.ExecutedIds>

  - name: ratchet.specification.LoadBound
    kind: struct
    naming:
      summary: >-
        The bound on `host_load_per_cpu`: the mean of the 1-minute load average over the run,
        divided by the number of CPUs; the bound applies to the mean (§ 3). Ratchet ships no
        default.
    fields:
      - name: max
        type: Decimal
        summary: >-
          In a file, the decimal of the number's text as written: `max: 2.125` is `2.125`
          (docs/design.md § 12).

  - name: ratchet.specification.ToolPin
    kind: struct
    naming:
      summary: >-
        A tool's declared version, or the file that pins it: `{pin: rust-toolchain.toml}`
        (§ 3). A version is written `{version: "0.97.4"}`, never as a bare string: an ESS
        shorthand needs a required field, and a pin has no version.
    fields:
      - name: version
        type: Optional<String>
      - name: pin
        type: Optional<String>

  - name: ratchet.specification.ObservationConditions
    kind: struct
    undeclared_fields: ignored
    naming:
      summary: >-
        The conditions that qualify in one target class (§ 3 "Conditions are declared per target
        class"). They qualify the run, and so every measurement of the plan: in a plan with
        exact and sampled measurements, a condition that its sampled measurements need, such as
        `host_load_per_cpu` or `runner`, qualifies its exact measurements too (§ 3 "Exact and
        sampled measurements of one run"). Three have a defined meaning; an assessor declares
        others, such as `cache_profile: warm`, which this open struct admits. A plan and a declaration write the
        cache condition as `cache_profile`, the member of the record, and under no other name.
    fields:
      - name: host_load_per_cpu
        type: Optional<ratchet.specification.LoadBound>
      - name: tools
        type: Optional<Map<String, ratchet.specification.ToolPin>>
        summary: >-
          A map from a tool to its version or pin file. Replaces `toolchain: pinned`. A tool at
          another version is insufficient evidence with the cause `tool_mismatch`.
      - name: runner
        type: Optional<String>
        summary: The label of the runner or runner class.

  - name: ratchet.specification.PairedRun
    kind: struct
    naming:
      summary: >-
        A paired run (§ 3): the assessor builds the revision that holds the accepted reference
        and measures it and the candidate interleaved on the same runner. Not a reference kind.
    fields:
      - name: pairs
        type: Integer

  - name: ratchet.specification.WindowLength
    kind: newtype
    of: String
    naming:
      summary: >-
        A duration back from the end of a window: a whole number and `m`, `h` or `d`, such as
        `7d` (§ 3 "Time windows").

  - name: ratchet.specification.WindowSpec
    kind: struct
    naming:
      summary: >-
        The interval of a time-window plan (§ 3 "Time windows"): `{length: 7d}`, `{last: 20}`,
        or both, and then the window holds the newest `last` items inside `length`. The window
        ends when the plan is assessed; the evidence records the exact bounds. A gate that
        should judge the last run declares `{last: 1}` (§ 5). No example uses the shape yet.
    fields:
      - name: length
        type: Optional<ratchet.specification.WindowLength>
      - name: last
        type: Optional<Integer>
        summary: A number of population items, newest first.
    invariants:
      - any: ["defined(length)", "defined(last)"]
      - any: ["not defined(last)", "last >= 1"]

  # § 3 value lists: run source (`from`), Ratchet, closed. For a population: `trusted_revision`,
  # the runs on the trusted branch alone, or `any_revision`, the runs of every candidate too. An
  # adoption takes `trusted_revision` only (`ratchet.specification.AdoptionSource`).
  - name: ratchet.specification.RunSource
    kind: enum
    variants: [trusted_revision, any_revision]

  - name: ratchet.specification.PopulationSpec
    kind: struct
    naming:
      summary: >-
        The population a time-window plan reads (§ 3 "Time windows"), in one of two forms.
        `{runs_of: <assessment>, from: any_revision}`: the assessment runs of another plan of
        the same specification, the source plan, read from the record store by the built-in
        assessor `record-series@1`; only runs that qualified under the source plan enter, and
        the evidence counts the runs left out. `{filter: {service: portal, region: eu}}`: a
        population the assessor reads outside the record store, such as production telemetry
        or a job log; the fields are those the assessor declares for its population
        (`ratchet.assessor.Assessor.population_fields`).
    fields:
      - name: runs_of
        type: Optional<ratchet.specification.AssessmentName>
        summary: >-
          The source plan. Inside a struct, which a relation's `via:` cannot name, so the link
          has no relation entry; `ratchet validate` resolves it (`unresolved_reference`).
      - name: from
        type: Optional<ratchet.specification.RunSource>
        summary: Required with `runs_of`, absent with `filter`.
      - name: filter
        type: Optional<Map<String, String>>
    invariants:
      - any: ["defined(runs_of)", "defined(filter)"]
      - any: ["not defined(runs_of)", "not defined(filter)"]
      - any: ["not defined(runs_of)", "defined(from)"]
      - any: ["defined(runs_of)", "not defined(from)"]

  - name: ratchet.specification.ObservationPlan
    kind: struct
    naming:
      summary: >-
        How evidence is collected: the observation kind, the scenarios, the workload or command,
        the run or sample count, a paired run or a time window, the conditions that qualify per
        target class and the coverage that qualifies (§ 3). A time-window plan
        (`kind: time_window`) declares `window`, `population` and `min_samples`; a plan of
        another kind declares neither `window` nor `population`. `ratchet validate` reports
        both (`time_window_incomplete`, `window_on_other_kind`). One plan may hold exact and
        sampled measurements of its one run, in every observation kind: the kind is that of the
        run, such as `controlled_run` with `runs: 1` for a browser run that yields a count and
        a duration, and the kinds of the measurements do not change it. No form is refused for
        the mix, so no invariant states it (§ 3 "Exact and sampled measurements of one run").
    invariants:
      - any: ["kind != time_window", "defined(window)"]
      - any: ["kind != time_window", "defined(population)"]
      - any: ["kind != time_window", "defined(min_samples)"]
      - any: ["kind == time_window", "not defined(window)"]
      - any: ["kind == time_window", "not defined(population)"]
    fields:
      - name: kind
        type: ratchet.specification.ObservationKind
      - name: scenarios
        type: Optional<List<String>>
        summary: >-
          ESS scenarios or ESS UI interactions; an entry can end in `*`, such as
          `ess-ui:partner-portal/search-*`. The scope keeps one result per scenario.
      - name: workload
        type: Optional<String>
      - name: command
        type: Optional<String>
        summary: The project command a command assessor runs, such as `task test`.
      - name: runs
        type: Optional<Integer>
        summary: >-
          One is valid; repeated runs are needed where the plan aggregates across runs. With
          one run a measurement may aggregate the repeats its command makes itself (§ 3 "One
          run per candidate is valid").
      - name: min_samples
        type: Optional<Integer>
        summary: >-
          The fewest samples that qualify. On a time-window plan it is required and counts
          population items: below it the verdict is insufficient evidence with the cause
          `too_few_samples`. Ratchet ships no default (§ 3, § 11 "Not changed").
      - name: paired
        type: Optional<ratchet.specification.PairedRun>
      - name: window
        type: Optional<ratchet.specification.WindowSpec>
      - name: population
        type: Optional<ratchet.specification.PopulationSpec>
      - name: conditions
        type: Optional<Map<String, ratchet.specification.ObservationConditions>>
        summary: >-
          Keyed by target class (`local`, `ci`, …), with `all` for what holds in every class.
          `ratchet validate` reports a sampled measurement whose plan declares none, except on
          a window over `runs_of`, which declares no conditions of its own: only runs that
          qualified under the source plan enter its population (§ 3).
      - name: coverage
        type: Optional<ratchet.specification.CoverageBounds>

  # § 3 value lists: Ratchet, closed. The five number operators compare a number or the item
  # count of a set; `no_new_items` and `no_lost_items` compare a set with the accepted set;
  # `holds` takes an assertion.
  - name: ratchet.specification.ComparisonOperator
    kind: enum
    variants: [lt, lte, gt, gte, eq, no_new_items, no_lost_items, holds]

  - name: ratchet.specification.Condition
    kind: struct
    naming:
      summary: >-
        A comparison with a fixed limit (§ 3 "Comparisons"). It states the unit of its
        measurement when the measurement has one, and none otherwise; another unit is a
        validation error.
    fields:
      - name: operator
        type: ratchet.specification.ComparisonOperator
      - name: value
        type: Optional<Decimal>
        summary: >-
          The limit; absent for `no_new_items`, `no_lost_items` and `holds`. In a file, the
          decimal of the number's text as written (docs/design.md § 12).
      - name: unit
        type: Optional<ratchet.specification.Unit>
        summary: >-
          Present exactly when the assessor declares a unit for the measurement's output
          (`unit_missing`, `unit_mismatch`, `unit_not_declared`).

  # § 3 value lists: Ratchet, closed.
  - name: ratchet.specification.ReferenceKind
    kind: enum
    variants: [generated, accepted_value]

  - name: ratchet.specification.Tolerance
    kind: struct
    naming:
      summary: >-
        The regression band against an accepted value: `{percent: 10}`, `{absolute: 30}` in the
        unit of the measurement, or both, and then the wider band applies (§ 3). 0 by default
        for exact measurements; Ratchet ships no default band. In a file, each number is the
        decimal of its text as written (docs/design.md § 12).
    fields:
      - name: percent
        type: Optional<Decimal>
      - name: absolute
        type: Optional<Decimal>
        summary: >-
          In the unit of the measurement; a bare number on an output without a unit.

  - name: ratchet.specification.AdoptionSource
    kind: enum
    variants: [same_change, trusted_revision]

  - name: ratchet.specification.RatchetPolicy
    kind: struct
    naming:
      summary: >-
        The ratchet policy of a requirement: the `adoption` of its reference (§ 1, § 5).
        `{from: same_change}` has the candidate write the better value with
        `ratchet reference adopt`, verified against its own qualifying evidence; the default
        for exact measurements. `{from: trusted_revision, runs: N, aggregation}` takes the
        aggregation of the last N qualifying runs on the trusted revision; the default for
        sampled measurements, and N has no default. On a time-window plan `runs` counts
        windows: `runs: 4` is the last four windows an evaluation recorded, and windows that
        overlap share items (§ 3).
    fields:
      - name: from
        type: ratchet.specification.AdoptionSource
      - name: runs
        type: Optional<Integer>
      - name: aggregation
        type: Optional<ratchet.specification.Aggregation>

  - name: ratchet.specification.ReferenceDeclaration
    kind: struct
    naming:
      summary: >-
        The protected reference a requirement compares against (§ 3, § 5). The accepted values
        themselves live in reference records that `ratchet reference adopt` writes.
    fields:
      - name: kind
        type: ratchet.specification.ReferenceKind
      - name: paths
        type: Optional<List<String>>
        summary: For a generated reference, the committed files, such as `docs/reference/**`.
      - name: tolerance
        type: Optional<ratchet.specification.Tolerance>
        summary: >-
          For an accepted value. `ratchet validate` reports a sampled measurement with an
          accepted value and no tolerance.
      - name: adoption
        type: Optional<ratchet.specification.RatchetPolicy>
        summary: >-
          For an accepted value. `ratchet validate` reports a sampled measurement with an
          accepted value and no `adoption`.

  - name: ratchet.specification.PlantedDefectId
    kind: newtype
    of: String
    naming:
      summary: The `id` of a planted defect, such as `unlabelled-button`.

  - name: ratchet.specification.PlantedDefect
    kind: struct
    naming:
      summary: >-
        An input the assessor must refuse (§ 4 "Proof that a check can fail"). It has an `id`
        and one of two forms: `inputs` replaces inputs of the plan for that run (a broken copy
        of a manifest, a report with a known finding); `patch` is a patch file applied to a
        scratch copy of the tree. Exactly one of the two is present.
    fields:
      - name: id
        type: ratchet.specification.PlantedDefectId
      - name: inputs
        type: Optional<Map<String, Json>>
      - name: patch
        type: Optional<String>

  - name: ratchet.specification.RequirementName
    kind: newtype
    of: String
    naming:
      summary: >-
        The key of a requirement under `requirements:`, such as `search-latency-budget`. A
        requirement bound from a preset is named `<binding>.<requirement>`, such as
        `ux.steps-do-not-rise` (§ 4).

  - name: ratchet.specification.GateName
    kind: newtype
    of: String
    naming:
      summary: The key of a gate under `gates:`, such as `merge` or `promote`.

  - name: ratchet.specification.Stage
    kind: newtype
    of: String
    naming:
      summary: >-
        The workflow stage a gate decides at, such as `pre-merge` or `daily`. A free label
        (§ 3 value lists, § 7).

  # § 3 value lists: Ratchet, closed.
  - name: ratchet.specification.GateMode
    kind: enum
    variants: [enforce, report]

  # § 3 value lists: Ratchet, closed. An operational gate judges a host or a population and
  # decides nothing about a candidate (§ 5 "Gate kinds").
  - name: ratchet.specification.GateKind
    kind: enum
    variants: [candidate, operational]

  # § 3 value lists: Ratchet, closed (§ 5 "Which evidence decides").
  - name: ratchet.specification.DecidingEvidence
    kind: enum
    variants: [any, all]

  - name: ratchet.specification.GateRequirementId
    kind: newtype
    of: String
    naming:
      summary: >-
        One entry of a gate's `requires:` list, identified as `<gate>/<requirement>`: a gate
        lists a requirement once (§ 5).

  - name: ratchet.specification.ChangedPaths
    kind: struct
    naming:
      summary: >-
        `when: {changed: [paths]}` on a gate entry: the entry applies when the change touches a
        listed path. The change is the difference between the trusted revision and the
        candidate; the path list is policy and is read from the trusted revision (§ 5).
    fields:
      - name: changed
        type: List<String>

  - name: ratchet.specification.ExceptionId
    kind: newtype
    of: String
    naming:
      summary: >-
        The authored id of an exception: its key under `exceptions:` (§ 5, § 6), such as
        `filter-reset-target-size`.

  - name: ratchet.specification.OwnerRef
    kind: newtype
    of: String
    naming:
      summary: >-
        An owner reference, a story or decision id such as `story:filter-bar`. A free label
        (§ 3 value lists).

  - name: ratchet.specification.DecisionRef
    kind: newtype
    of: String
    naming:
      summary: The revision or decision that authorized a change, such as `decision:<id>` (§ 5, § 6).

  # § 4 "Custom assessors": string, integer, decimal, boolean, path, or a list of one of these.
  - name: ratchet.specification.InputType
    kind: enum
    variants: [string, integer, decimal, boolean, path]

  - name: ratchet.specification.InputDeclaration
    kind: struct
    naming:
      summary: >-
        One declared input of an assessor or a preset (§ 4), an entry of `inputs` under the
        input's name: a type, whether it is required, a default, and whether it is local. A
        plan passes the assessor inputs that are not local as `inputs`, a binding passes preset
        inputs as `with`, and `ratchet validate` checks names and types against the
        declaration. A local input has the type `path` and is not a list.
    invariants:
      - any: ["not defined(local)", "local == false", "type == path"]
      - any: ["not defined(local)", "local == false", "not defined(list)", "list == false"]
    fields:
      - name: type
        type: ratchet.specification.InputType
      - name: list
        type: Optional<Boolean>
        summary: The input is a list of `type`.
        # UNMAPPED: § 4 allows "a list of one of these" and gives no spelling for a list type;
        # a `list` flag beside the element type is this draft's proposal.
      - name: required
        type: Boolean
      - name: default
        type: Optional<Json>
        summary: A value of the declared type, where a default is meaningful.
      - name: local
        type: Optional<Boolean>
        summary: >-
          The value differs per machine, such as the place of a build pool's job log (§ 4
          "Local inputs"; D6 of docs/design.md § 9, open, written under default A). The
          specification cannot set it (`local_input_in_specification`); the local config
          supplies it under
          `[inputs.<assessment>]` (`ratchet.config.LocalConfig.inputs`), and the assessment run
          records the resolved value. A required local input with no value on a machine makes
          the requirement not assessable there (`not_assessable_here`). Absent means not local.
          A preset input is never local (`preset_input_local`).

  - name: ratchet.specification.PresetRef
    kind: newtype
    of: String
    naming:
      summary: A preset and its version, `web-ux@1` (§ 4).

  - name: ratchet.specification.PresetBindingName
    kind: newtype
    of: String
    naming:
      summary: >-
        The key a project binds a preset under, such as `ux`; the bound entries join the project
        under it, `ux.steps-do-not-rise` (§ 4).

  # § 4 "Presets": what a preset file holds beside `format` and its `preset` block. Each value
  # is the key of a map at the root of the file, and the name of the relation of
  # `ratchet.specification.QualitySpecification` whose target is the entity of the entries: a
  # preset holds the statements, assessments and requirements of a project by the same types.
  # It holds no `subjects`, `gates`, `exceptions` and `presets`: the subject of a plan is an
  # input, which requirement blocks at which stage is the project's decision, and a preset
  # binds no preset. `spec/presets.test.sh` reads this list and those relations.
  - name: ratchet.specification.PresetMember
    kind: enum
    variants: [statements, assessments, requirements]

  - name: ratchet.specification.InputReference
    kind: newtype
    of: String
    naming:
      summary: >-
        `${inputs.<name>}` in an entry of a preset (§ 4): the value the binding passes for the
        declared input `<name>`, or the default of that input. A reference is the whole of a
        value, and no text stands beside it: it stands for a scalar where the input is one
        and for a list where the input declares `list`. An input of the type `string` or `path`
        stands for text and for a value of a closed list, `integer` for an integer and a
        decimal, `decimal` for a decimal, `boolean` for a boolean. No key is a reference, and
        the `preset` block holds none. A name by which one entry of a preset names another
        entry of the same preset is written out and is no reference: the `assessment` and the
        `measurement` of a requirement and the statements it `serves`. A measurement of a
        preset is named `<name>@<version>/<assessment>/<measurement>`, and that name is fixed
        before a binding gives a value. `<name>` is the key of the input in `Preset.inputs`,
        which is text and may hold a `.`: `${inputs.a.b}` refers to the input `a.b`. Inside a
        flow mapping or a flow list the reference is
        quoted, `"${inputs.<name>}"`: a plain scalar there holds no brace. A quoted reference
        and a plain one mean the same. The spelling is the only one: a scalar of a preset that
        holds `${` or `{inputs.` and is not `${inputs.<name>}` alone, such as
        `${ inputs.report }` and `${{inputs.report}}`, is an error and no text.

entities:
  - name: ratchet.specification.QualitySpecification
    naming:
      summary: >-
        A project's versioned declaration of statements, subjects, audiences, requirements,
        assessment plans, gates and exceptions (§ 1). A project has one: its identity is the
        project, and "versioned" means the format version and the revision a gate reads it at;
        a gate decision records that revision (§ 5). Several files of `[spec] paths` form one
        specification with ids unique across them.
    provided: true
    identity:
      name: project
      type: ratchet.specification.ProjectName
    fields:
      - name: format
        type: String
        summary: The document format, `ratchet/1`; one across the files of a specification.
    relations:
      - name: statements
        kind: owns
        target: ratchet.specification.QualityStatement
        cardinality: many
        via: project
      - name: subjects
        kind: owns
        target: ratchet.specification.Subject
        cardinality: many
        via: project
      - name: assessments
        kind: owns
        target: ratchet.specification.AssessmentPlan
        cardinality: many
        via: project
      - name: requirements
        kind: owns
        target: ratchet.specification.QualityRequirement
        cardinality: many
        via: project
      - name: gates
        kind: owns
        target: ratchet.specification.Gate
        cardinality: many
        via: project
      - name: exceptions
        kind: owns
        target: ratchet.specification.Exception
        cardinality: many
        via: project
      - name: presets
        kind: owns
        target: ratchet.specification.PresetBinding
        cardinality: many
        via: project
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.QualityStatement
    naming:
      summary: >-
        A sentence in plain words about what quality means for an audience (§ 1). A requirement
        names the statements it serves; a statement no requirement serves is reported as not
        machine-checked.
    provided: true
    identity:
      name: statement
      type: ratchet.specification.StatementName
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: text
        type: String
      - name: audiences
        type: List<ratchet.specification.AudienceName>
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.Subject
    naming:
      summary: >-
        The thing assessed: a search interaction, an API operation, a codebase, a release
        workflow, or a coding agent's gate, error text or instruction file (§ 1).
    provided: true
    identity:
      name: subject
      type: ratchet.specification.SubjectName
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: kind
        type: ratchet.specification.SubjectKind
      - name: audiences
        type: List<ratchet.specification.AudienceName>
        summary: Who experiences this subject's quality.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.AssessmentPlan
    naming:
      summary: >-
        The instructions for collecting evidence: binds one or more measurements to an
        assessor, a target and observation conditions (§ 1). The assessor runs once per plan and
        every measurement reads that run (§ 3). An assessment with no requirement in any gate
        is in observe mode (§ 5). A time-window plan over `runs_of` is assessed by the built-in
        `record-series@1`, has no `selection` and declares no conditions; its target has the
        kind of the source plan's target and lists the classes whose runs count, one window per
        class (§ 3 "A series of runs as a population").
    provided: true
    identity:
      name: assessment
      type: ratchet.specification.AssessmentName
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: subject
        type: ratchet.specification.SubjectName
      - name: assessor
        type: ratchet.specification.AssessorRef
      - name: inputs
        type: Optional<Map<String, Json>>
        summary: >-
          The assessor's declared inputs that are not local, by name, such as
          `{report: target/ux-eval/report.json}` (§ 4); each value has the declared type. A
          local input set here is a validation error (`local_input_in_specification`), so the
          trusted revision holds no path of one machine (§ 5 rule 6).
      - name: target
        type: ratchet.specification.TargetSpec
      - name: observation
        type: ratchet.specification.ObservationPlan
      - name: measurements
        type: Map<String, ratchet.specification.Measurement>
        summary: Keyed by measurement name (`ratchet.specification.MeasurementName`).
    invariants:
      - any: ["not defined(observation.population.runs_of)", "assessor == \"record-series@1\""]
      - any: ["assessor != \"record-series@1\"", "defined(observation.population.runs_of)"]
      - any: ["not defined(observation.population.runs_of)", "not defined(target.selection)"]
      - any: ["not defined(observation.population.runs_of)", "not defined(observation.conditions)"]
    relations:
      - name: subject
        kind: references
        target: ratchet.specification.Subject
        cardinality: one
        via: subject
      - name: assessor
        kind: references
        target: ratchet.assessor.Assessor
        cardinality: one
        via: assessor
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.QualityRequirement
    naming:
      summary: >-
        A condition the project expects to hold, such as p95 latency below 100 ms, zero new
        analyzer findings of a severity, or a scenario passing (§ 1). It says what must hold;
        its assessment plan says how to know (§ 3). It compares in up to two ways and both must
        hold: `condition` with a fixed limit, `reference` with the protected reference.
    provided: true
    identity:
      name: requirement
      type: ratchet.specification.RequirementName
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: meaning
        type: Optional<String>
        summary: The requirement in plain words, which `ratchet explain` prints.
      - name: serves
        type: List<ratchet.specification.StatementName>
        summary: >-
          The quality statements this requirement serves. A file may leave `serves` out, and
          the list is then empty (docs/design.md § 12).
      - name: assessment
        type: ratchet.specification.AssessmentName
      - name: measurement
        type: Optional<ratchet.specification.MeasurementName>
        summary: The measurement of the plan; may be left out when the plan has one (§ 3).
      - name: condition
        type: Optional<ratchet.specification.Condition>
      - name: reference
        type: Optional<ratchet.specification.ReferenceDeclaration>
        summary: >-
          Valid without a `condition` for a number and for a digest (§ 3 "Comparisons").
      - name: planted_defects
        type: Optional<List<ratchet.specification.PlantedDefect>>
        summary: Inputs the assessor must refuse; `ratchet prove` runs them (§ 4).
    relations:
      - name: assessment
        kind: references
        target: ratchet.specification.AssessmentPlan
        cardinality: one
        via: assessment
      - name: serves
        kind: references
        target: ratchet.specification.QualityStatement
        cardinality: many
        via: serves
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.Gate
    naming:
      summary: >-
        A decision at a workflow stage, such as merge or promotion, that requires specified
        verdicts before a candidate can advance. It lists each requirement as enforce or report
        (§ 1, § 5). A candidate gate judges one candidate; an operational gate judges a host, a
        build pool or a population over a time window and never decides whether a candidate
        advances. A gate declares no exception, and a preset declares no gate (§ 4).
    provided: true
    identity:
      name: gate
      type: ratchet.specification.GateName
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: kind
        type: Optional<ratchet.specification.GateKind>
        summary: >-
          `candidate` by default (§ 5 "Gate kinds"). Every requirement of an `operational` gate
          names a time-window plan without `selection`, and its entries carry no `when`, which
          has no change to match; a `candidate` gate takes no requirement whose plan is a
          time-window plan without `selection` (D5 of docs/design.md § 9, open, written under
          default A). `ratchet validate` reports each (`plan_does_not_fit_gate_kind`, `when_in_operational_gate`). The rules
          join a gate, its entries and their plans, which an ESS invariant cannot read, so ESS
          does not check them here.
      - name: stage
        type: ratchet.specification.Stage
      - name: qualifying_environments
        type: List<ratchet.specification.TargetClass>
        summary: >-
          The target classes whose evidence qualifies (§ 3). The classes of a requirement are
          those the gate lists and its plan runs in; `ratchet validate` reports a requirement
          that has none.
      - name: evidence
        type: Optional<ratchet.specification.DecidingEvidence>
        summary: >-
          Which results decide when a requirement has several classes: `any` passes on one
          class's pass, `all` needs a pass from each. A fail from a qualifying class is a fail
          in both settings (§ 5). `any` when absent: D3 of docs/design.md § 9, decided A by the
          owner on 2026-11-24.
    relations:
      - name: requires
        kind: owns
        target: ratchet.specification.GateRequirement
        cardinality: many
        via: gate
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.GateRequirement
    naming:
      summary: >-
        One entry of a gate's `requires:` list: a requirement name, which means enforce, or a
        map with `requirement`, `mode`, `since` and `when` (§ 5). A map without `mode` means
        enforce too. A report-mode entry is
        evaluated and shown with its verdict and does not block. An entry whose `when` does not
        match the change is not applicable: not evaluated, not blocking, and listed with the
        reason.
    provided: true
    identity:
      name: entry
      type: ratchet.specification.GateRequirementId
    fields:
      - name: gate
        type: ratchet.specification.GateName
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: mode
        type: ratchet.specification.GateMode
        summary: >-
          `enforce` when the file lists the bare requirement name, and when it lists a map
          without `mode` (§ 5).
      - name: since
        type: Optional<ratchet.specification.CalendarDate>
        summary: >-
          Required with report mode: the date since which the requirement has not been
          enforced (§ 5). `ratchet validate` reports a report-mode entry without it.
      - name: when
        type: Optional<ratchet.specification.ChangedPaths>
        summary: Never in an operational gate (`when_in_operational_gate`).
    invariants:
      - any: ["mode == enforce", "defined(since)"]
    relations:
      - name: requirement
        kind: references
        target: ratchet.specification.QualityRequirement
        cardinality: one
        via: requirement
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.Exception
    naming:
      summary: >-
        An accepted departure from a requirement: a waived finding, a known-failing case, a
        raised limit, an allowlist entry or a worse accepted value. An entry of the
        specification and not a record of its own; a gate decision copies the exceptions it
        applied (§ 1, § 5, § 6). Active or expired is computed from the date at evaluation and
        not stored, so no command moves it and it has one lifecycle state. Adding or extending
        one is a policy change.
    provided: true
    identity:
      name: exception
      type: ratchet.specification.ExceptionId
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: item
        type: Optional<Json>
        summary: >-
          The excepted item of an identity set, with the shape of an accepted item's `identity`:
          exactly the fields of the set's identity key, such as
          `{rule, node_path, environment}`, where a field can be a map (§ 3).
      - name: value
        type: Optional<ratchet.specification.Condition>
        summary: >-
          For a raised limit, the condition that holds in place of the requirement's while the
          exception applies (§ 5).
      - name: reason
        type: String
      - name: owner
        type: ratchet.specification.OwnerRef
        summary: >-
          A story or decision id. An added or extended exception is a loosening: it lands in a
          change of its own, merged before the candidate, and the forge's review of that
          change is the authorization (D2 of docs/design.md § 9, decided A by the owner on
          2026-11-24). Hence no `authorized_by` field.
      - name: created
        type: Optional<ratchet.specification.CalendarDate>
        summary: >-
          Where the age is counted from; without it, the revision that added the entry (§ 5).
      - name: expires
        type: ratchet.specification.CalendarDate
        summary: >-
          A date only; an exception does not end at an event (D4 of docs/design.md § 9,
          decided A by the owner on 2026-11-24).
    relations:
      - name: requirement
        kind: references
        target: ratchet.specification.QualityRequirement
        cardinality: one
        via: requirement
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.Preset
    naming:
      summary: >-
        A reusable part of a specification in the catalog `presets/` (§ 1, § 2, § 4): a
        ratchet/1 document with a `preset` block in place of `project`, holding a name, a
        version and declared `inputs`. In a catalog source it is the file
        `<name>@<version>.preset.yaml` (`ratchet.config.CatalogFileKind`). Beside `format` and
        the block, the file holds the maps that `ratchet.specification.PresetMember` lists:
        `statements`, `assessments` and `requirements`, with entries of the entities a
        project's file holds under the same keys. An entry states no `project`: the binding
        gives it one. The entries refer to an input as `${inputs.<name>}`
        (`ratchet.specification.InputReference`), and the subject of a plan is such an input.
        A preset declares no subject, no gate, no exception and no binding of its own. The
        functional family of `presets/` is its first use.
    provided: true
    identity:
      name: preset
      type: ratchet.specification.PresetRef
    fields:
      - name: name
        type: String
      - name: version
        type: String
      - name: inputs
        type: Map<String, ratchet.specification.InputDeclaration>
        summary: >-
          The declared inputs by name, with the shape of an assessor's inputs, none of them
          local (`preset_input_local`).
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.PresetBinding
    naming:
      summary: >-
        A project's binding of a preset under a name (§ 4): `use`, the `digest` of the preset
        file, and `with`, the values of its declared inputs. A resolved preset with another
        digest is a validation error; the local config says where to look and cannot change
        what is found.
    provided: true
    identity:
      name: binding
      type: ratchet.specification.PresetBindingName
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: use
        type: ratchet.specification.PresetRef
      - name: digest
        type: String
        summary: "`sha256:<digest of the preset file>`."
      - name: with
        type: Optional<Map<String, Json>>
        summary: The preset's inputs by name; the only way a project changes its behaviour.
    relations:
      - name: use
        kind: references
        target: ratchet.specification.Preset
        cardinality: one
        via: use
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]
