domain: ratchet.specification

summary: >-
  What a project declares in its ratchet/1 document: subjects, audiences, assessment plans,
  requirements, gates and exceptions (docs/design.md § 1, § 3). Every entity here is authored in
  the document and read from the trusted revision; no Ratchet command creates one.

# Sources: docs/design.md § 1 (domain language), § 3 (illustrative project YAML), § 5 (gates,
# exceptions). Field names follow that YAML and are proposals (AGENTS.md § Phase: design).

types:
  - name: ratchet.specification.ProjectName
    kind: newtype
    of: String
    naming:
      summary: The `project:` key of a ratchet/1 document, such as `partner-portal`.

  - name: ratchet.specification.Revision
    kind: newtype
    of: String
    naming:
      summary: A repository revision, such as a commit id or the trusted copy on `main`.

  - name: ratchet.specification.CalendarDate
    kind: newtype
    of: String
    naming:
      summary: An ISO 8601 calendar date, `2026-12-15`, as `expires:` and `since:` spell it.

  - name: ratchet.specification.SubjectName
    kind: newtype
    of: String
    naming:
      summary: The key of a subject under `subjects:`.

  - name: ratchet.specification.SubjectKind
    kind: newtype
    of: String
    naming:
      summary: >-
        What sort of thing a subject is, such as `user-interaction` or `development-workflow`.
        The design names examples, not a closed set.

  - name: ratchet.specification.AudienceName
    kind: newtype
    of: String
    naming:
      summary: Who experiences a subject's quality, such as `portal-user` or `coding-agent`.

  - name: ratchet.specification.AssessmentName
    kind: newtype
    of: String
    naming:
      summary: The key of an assessment plan under `assessments:`.

  - name: ratchet.specification.AssessorRef
    kind: newtype
    of: String
    naming:
      summary: An assessor and its pinned version, `browser-request-timing@1`.

  - name: ratchet.specification.Unit
    kind: newtype
    of: String
    naming:
      summary: >-
        The unit of a value: `ms`, `s`, bytes, a count, money per run or per day, model calls
        per run (§ 3).

  # § 1, § 3: exact gives the same value for the same input under the same conditions; sampled
  # varies between runs.
  - name: ratchet.specification.MeasurementKind
    kind: enum
    variants: [exact, sampled]

  # § 1, § 3 "Scope and aggregation": the unit one result belongs to.
  - name: ratchet.specification.Scope
    kind: enum
    variants: [state, journey, page, test, variant, run]

  # § 3 table: exact measurements aggregate by none or a sum within the scope; sampled ones by
  # median, percentile, best of N or pass rate. The YAML spells a percentile `p95`.
  - name: ratchet.specification.AggregationKind
    kind: enum
    variants: [sum, median, percentile, best_of_n, pass_rate]

  - name: ratchet.specification.Aggregation
    kind: struct
    fields:
      - name: kind
        type: ratchet.specification.AggregationKind
      - name: parameter
        type: Optional<Integer>
        summary: >-
          The rank of a percentile (95 for `p95`) or the N of best of N. A proposal: the design
          writes `aggregation: p95` as one word.

  - name: ratchet.specification.Measurement
    kind: struct
    naming:
      summary: >-
        The value or assertion being evaluated, with a kind, unit, scope and aggregation
        (§ 1). It is part of an assessment plan.
    fields:
      - name: kind
        type: ratchet.specification.MeasurementKind
      - name: output
        type: String
        summary: The assessor output it reads, such as `findings` or `duration`.
      - name: unit
        type: Optional<ratchet.specification.Unit>
      - name: scope
        type: ratchet.specification.Scope
      - name: aggregation
        type: Optional<ratchet.specification.Aggregation>
      - name: boundary
        type: Optional<String>
        summary: >-
          Which part of a duration the requirement is about, such as `run-time`, `queue-wait`
          or `request-start-to-response-complete` (§ 3).
      - name: also_record
        type: Optional<List<String>>
        summary: Further parts recorded beside it, such as `queue-wait`.
      - name: identity
        type: Optional<List<String>>
        summary: >-
          The identity key when the measurement is an identity set, such as
          `[rule, node_path, environment]` (§ 1, § 4).

  # § 3 table "Observation".
  - name: ratchet.specification.ObservationKind
    kind: enum
    variants: [snapshot, controlled_run, time_window]

  # § 1 "Target" and § 3: revision, build, deployed service, workflow run, telemetry population.
  - name: ratchet.specification.TargetKind
    kind: enum
    variants: [revision, build, deployment, workflow_run, telemetry_population]

  # § 3: "Local, CI, ephemeral, staging, and production are explicit target classes."
  - name: ratchet.specification.TargetClass
    kind: enum
    variants: [local, ci, ephemeral, staging, production]

  - name: ratchet.specification.TargetSpec
    kind: struct
    naming:
      summary: >-
        The expected target an assessment plan names (§ 3). The evidence records the resolved
        target beside it.
    fields:
      - name: kind
        type: ratchet.specification.TargetKind
      - name: environments
        type: List<ratchet.specification.TargetClass>
        summary: >-
          The target classes the plan runs in. The § 3 YAML spells this `environment:`, a
          single class or a list; one list is the proposal here.
      - name: selection
        type: Optional<String>
        summary: Which instance is assessed, such as `candidate`.

  - name: ratchet.specification.CoverageBounds
    kind: struct
    naming:
      summary: >-
        The coverage that qualifies, as bounds on the counts or as an exact set of executed item
        ids (§ 3 "Evidence coverage"). A run below it is insufficient evidence.
    fields:
      - name: skipped
        type: Optional<Integer>
        summary: The most skipped items that still qualify; `0` in the § 3 YAML.
      - name: not_run
        type: Optional<Integer>
      - name: unsupported
        type: Optional<Integer>
      - name: executed_items
        type: Optional<List<String>>
        summary: The exact set of item ids a qualifying run executes.

  - name: ratchet.specification.ObservationPlan
    kind: struct
    naming:
      summary: >-
        How evidence is collected: the observation kind, the workload, the sample or run count,
        the conditions that qualify and the coverage that qualifies (§ 3).
    fields:
      - name: kind
        type: ratchet.specification.ObservationKind
      - name: scenario
        type: Optional<String>
        summary: An ESS scenario or ESS UI interaction, `ess-ui:partner-portal/partner-search`.
      - name: workload
        type: Optional<String>
      - name: command
        type: Optional<String>
        summary: The project command a command assessor runs, such as `task test`.
      - name: runs
        type: Optional<Integer>
      - name: min_samples
        type: Optional<Integer>
      - name: conditions
        type: Optional<Map<String, Json>>
        summary: >-
          The observation conditions that qualify, by name: `runner: dedicated`,
          `toolchain: pinned`, `host_load_per_cpu: {max: 1.0}`. `ratchet validate` reports a
          sampled measurement whose plan declares none.
      - name: coverage
        type: Optional<ratchet.specification.CoverageBounds>
      # UNMAPPED: § 3 names a time window ("a rolling 30-day production window") and a paired
      # run (reference and candidate interleaved on one runner) as plan choices, and gives
      # neither a field. Open question: their shape in the plan.

  - name: ratchet.specification.RequirementName
    kind: newtype
    of: String
    naming:
      summary: The key of a requirement under `requirements:`, such as `search-latency-budget`.

  # § 3 YAML spells `lt`, `lte` and `no-new-items`. `gt`, `gte` and `eq` complete the typed
  # comparison § 2 promises. `no_lost_items` is the comparison § 4 asks of a passing-case set
  # ("no case in the accepted set fails or stops running"); the design gives it no operator name.
  - name: ratchet.specification.ComparisonOperator
    kind: enum
    variants: [lt, lte, gt, gte, eq, no_new_items, no_lost_items]

  - name: ratchet.specification.Condition
    kind: struct
    naming:
      summary: What must hold, as an operator against an absolute limit or the reference (§ 3).
    fields:
      - name: operator
        type: ratchet.specification.ComparisonOperator
      - name: value
        type: Optional<Decimal>
        summary: The absolute limit; absent for an identity-set comparison.
      - name: unit
        type: Optional<ratchet.specification.Unit>

  # § 1 "Protected reference" and the § 5 table.
  - name: ratchet.specification.ReferenceKind
    kind: enum
    variants: [generated, accepted_value]

  - name: ratchet.specification.Tolerance
    kind: struct
    naming:
      summary: >-
        The regression band against an accepted value: 0 by default for exact measurements, a
        declared band for sampled ones (§ 3, § 5). `{percent: 10}` in the § 3 YAML, a 30-second
        band in the § 5 example.
    fields:
      - name: percent
        type: Optional<Decimal>
      - name: value
        type: Optional<Decimal>
      - name: unit
        type: Optional<ratchet.specification.Unit>

  - name: ratchet.specification.ReferenceDeclaration
    kind: struct
    naming:
      summary: >-
        The kind of protected reference a requirement compares against and its tolerance. The
        reference values themselves live in reference records (§ 3, after the YAML).
    fields:
      - name: kind
        type: ratchet.specification.ReferenceKind
      - name: tolerance
        type: Optional<ratchet.specification.Tolerance>

  - name: ratchet.specification.RatchetPolicy
    kind: struct
    naming:
      summary: >-
        The rule for when an evidenced improvement can tighten a requirement or replace its
        protected reference (§ 1, § 5).
    fields:
      - name: adoption_runs
        type: Optional<Integer>
        summary: >-
          How many comparable results support an adoption, such as the last 10 runs on the
          default branch (§ 5).
      - name: adoption_aggregation
        type: Optional<ratchet.specification.Aggregation>
        summary: How those results become the adopted value, such as their median (§ 5).
    # UNMAPPED: § 1 names the ratchet policy and § 5 gives its examples ("repeated comparable
    # results", "the median of the last 10 runs"), but the § 3 YAML has no policy key and no
    # section says whether it is declared per requirement, per reference kind or per project.
    # Both field names above are proposals of this draft.

  - name: ratchet.specification.GateName
    kind: newtype
    of: String
    naming:
      summary: The key of a gate under `gates:`, such as `merge` or `promote`.

  - name: ratchet.specification.Stage
    kind: newtype
    of: String
    naming:
      summary: The workflow stage a gate decides at, such as `pre-merge` or `pre-promotion`.

  # § 5 "Gate modes".
  - name: ratchet.specification.GateMode
    kind: enum
    variants: [enforce, report]

  - name: ratchet.specification.GateRequirementId
    kind: newtype
    of: String
    naming:
      summary: >-
        One entry of a gate's `requires:` list. The YAML gives an entry no id; the proposal is
        `<gate>/<requirement>`, unique because a gate lists a requirement once.

  - name: ratchet.specification.ExceptionId
    kind: newtype
    of: String
    naming:
      summary: The stable id of an exception record (§ 6 "Each record has a stable id").

  - name: ratchet.specification.OwnerRef
    kind: newtype
    of: String
    naming:
      summary: An owner reference, a story or decision id such as `story:filter-bar` (§ 5).

  - name: ratchet.specification.DecisionRef
    kind: newtype
    of: String
    naming:
      summary: The revision or decision that authorized a policy change (§ 5, § 6).

entities:
  - name: ratchet.specification.QualitySpecification
    naming:
      summary: >-
        A project's versioned declaration of subjects, audiences, requirements, assessment
        plans and gates (§ 1). A gate reads it from the trusted revision (§ 5).
    provided: true
    identity:
      name: project
      type: ratchet.specification.ProjectName
    fields:
      - name: format
        type: String
        summary: The document format, `ratchet/1`.
      # UNMAPPED: § 1 says the specification is "versioned" and § 5 says a gate uses "policy
      # from a trusted revision", but nothing says whether one row is the project (identity
      # `project`, as here) or one revision of its document (identity project plus revision).
      # The gate decision's `policy_revision` carries the revision until that is settled.
    relations:
      - name: subjects
        kind: owns
        target: ratchet.specification.Subject
        cardinality: many
        via: project
      - name: assessments
        kind: owns
        target: ratchet.specification.AssessmentPlan
        cardinality: many
        via: project
      - name: requirements
        kind: owns
        target: ratchet.specification.QualityRequirement
        cardinality: many
        via: project
      - name: gates
        kind: owns
        target: ratchet.specification.Gate
        cardinality: many
        via: project
      - name: exceptions
        kind: owns
        target: ratchet.specification.Exception
        cardinality: many
        via: project
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.Subject
    naming:
      summary: >-
        The thing assessed: a search interaction, an API operation, a codebase, a release
        workflow, or a coding agent's gate, error text or instruction file (§ 1).
    provided: true
    identity:
      name: subject
      type: ratchet.specification.SubjectName
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: kind
        type: ratchet.specification.SubjectKind
      - name: audiences
        type: List<ratchet.specification.AudienceName>
        summary: >-
          Who experiences this subject's quality. An audience is a name only: the design gives
          it no attribute of its own, so it is not an entity.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.AssessmentPlan
    naming:
      summary: >-
        The instructions for collecting evidence: binds a measurement to an assessor, a target
        and observation conditions (§ 1). An assessment no gate requires is in observe mode
        (§ 5).
    provided: true
    identity:
      name: assessment
      type: ratchet.specification.AssessmentName
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: subject
        type: ratchet.specification.SubjectName
      - name: assessor
        type: ratchet.specification.AssessorRef
      - name: target
        type: ratchet.specification.TargetSpec
      - name: observation
        type: ratchet.specification.ObservationPlan
      - name: measurement
        type: ratchet.specification.Measurement
    relations:
      - name: subject
        kind: references
        target: ratchet.specification.Subject
        cardinality: one
        via: subject
      - name: assessor
        kind: references
        target: ratchet.assessor.Assessor
        cardinality: one
        via: assessor
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.QualityRequirement
    naming:
      summary: >-
        A condition the project expects to hold, such as p95 latency below 100 ms, zero new
        analyzer findings of a severity, or a scenario passing (§ 1). It says what must hold;
        its assessment plan says how to know (§ 3).
    provided: true
    identity:
      name: requirement
      type: ratchet.specification.RequirementName
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: assessment
        type: ratchet.specification.AssessmentName
      - name: condition
        type: ratchet.specification.Condition
      - name: reference
        type: Optional<ratchet.specification.ReferenceDeclaration>
        summary: Absent for a requirement against an absolute limit only.
      - name: policy
        type: Optional<ratchet.specification.RatchetPolicy>
      - name: planted_defects
        type: Optional<List<String>>
        summary: >-
          Inputs the assessor must refuse; `ratchet prove` runs them (§ 4 "Proof that a check
          can fail").
        # UNMAPPED: § 4 says a requirement "can declare planted defects, which are inputs the
        # assessor must refuse", and gives no shape for one (a path, a mutation, a broken copy
        # of a manifest). A list of strings is a placeholder.
      - name: meaning
        type: Optional<String>
        summary: The requirement in plain words, which `ratchet explain` prints.
        # UNMAPPED: docs/product-brainstorm.md § 3 and § 5 ask for a requirement's
        # plain-language meaning, and § 4 for the plain-language quality statement it serves;
        # docs/design.md gives the requirement no such field and has no noun for the statement.
    relations:
      - name: assessment
        kind: references
        target: ratchet.specification.AssessmentPlan
        cardinality: one
        via: assessment
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.Gate
    naming:
      summary: >-
        A decision at a workflow stage, such as merge or promotion, that requires specified
        verdicts before a candidate can advance. It lists each requirement as enforce or report
        (§ 1, § 5).
    provided: true
    identity:
      name: gate
      type: ratchet.specification.GateName
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: stage
        type: ratchet.specification.Stage
      - name: qualifying_environments
        type: List<ratchet.specification.TargetClass>
        summary: The target classes whose evidence qualifies for this gate (§ 3).
    relations:
      - name: requires
        kind: owns
        target: ratchet.specification.GateRequirement
        cardinality: many
        via: gate
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.GateRequirement
    naming:
      summary: >-
        One entry of a gate's `requires:` list: a requirement and its mode. A report-mode entry
        is evaluated and shown with its verdict and does not block (§ 5 "Gate modes").
    provided: true
    identity:
      name: entry
      type: ratchet.specification.GateRequirementId
    fields:
      - name: gate
        type: ratchet.specification.GateName
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: mode
        type: ratchet.specification.GateMode
        summary: "`enforce` when the YAML lists the bare requirement name."
      - name: since
        type: Optional<ratchet.specification.CalendarDate>
        summary: >-
          For report mode, the date since which the requirement has not been enforced (§ 5).
    relations:
      - name: requirement
        kind: references
        target: ratchet.specification.QualityRequirement
        cardinality: one
        via: requirement
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: ratchet.specification.Exception
    naming:
      summary: >-
        An accepted departure from a requirement: a waived finding, a known-failing case, a
        raised limit, an allowlist entry or a worse accepted value. It carries a reason, an
        owner reference and an expiry date; past the expiry it no longer applies (§ 1, § 5,
        § 6).
    provided: true
    identity:
      name: exception
      type: ratchet.specification.ExceptionId
      # UNMAPPED: the § 3 YAML lists exceptions without an id and § 6 says every record has a
      # stable id; nothing says who assigns it or how.
    fields:
      - name: project
        type: ratchet.specification.ProjectName
      - name: requirement
        type: ratchet.specification.RequirementName
      - name: item
        type: Optional<Json>
        summary: >-
          The excepted item of an identity set, keyed by the set's identity key, such as
          `{rule, node_path, environment}`.
      - name: value
        type: Optional<ratchet.specification.Condition>
        summary: >-
          The excepted value: a raised limit, or the condition that holds in place of the
          requirement's while the exception applies. A proposal; § 6 says "excepted item or
          value" and gives no shape for the value.
      - name: reason
        type: String
      - name: owner
        type: ratchet.specification.OwnerRef
      - name: created
        type: Optional<ratchet.specification.CalendarDate>
      - name: expires
        type: ratchet.specification.CalendarDate
      - name: authorized_by
        type: Optional<ratchet.specification.DecisionRef>
        summary: The decision that authorized it; adding or extending one is a policy change (§ 5).
    relations:
      - name: requirement
        kind: references
        target: ratchet.specification.QualityRequirement
        cardinality: one
        via: requirement
    # Active or expired is not a stored state: `ratchet evaluate` compares `expires` with the
    # evaluation date (§ 5), so an exception expires without any command moving it. Hence one
    # lifecycle state.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]
